<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 面板全功能管理工具 (board_adjustment.html)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        peach: {
                            300: '#fde5be',
                            400: '#fcd8a0',
                            500: '#fcd191',
                            600: '#e0b879',
                        },
                        charcoal: {
                            800: '#2c2c31',
                            850: '#232327',
                            900: '#1c1c1f',
                            950: '#141416',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #141416;
            color: #f3f4f6;
        }
        .glass-panel {
            background: rgba(35, 35, 39, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: linear-gradient(180deg, rgba(35, 35, 39, 0.85) 0%, rgba(35, 35, 39, 0.55) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(252, 209, 145, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .tab-dragging {
            opacity: 0.4;
            border-style: dashed !important;
            border-color: #fcd191 !important;
        }
        .thumb-dragging {
            opacity: 0.45;
            transform: scale(0.95);
            border-color: #fcd191 !important;
        }

        .board-thumbnail-strip-wrapper {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            transform-origin: center center;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
            z-index: 20;
        }

        .board-thumbnail-strip-wrapper.expanding {
            transform: translateX(-50%) scaleX(1);
            opacity: 1;
            pointer-events: auto;
        }

        .thumb-track {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 100%;
            cursor: grab;
            user-select: none;
            touch-action: none;
            will-change: transform;
        }
        .thumb-track:active {
            cursor: grabbing;
        }
        .thumb-item {
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1.5px solid rgba(252, 209, 145, 0.5);
            background: #1c1c1f;
        }

        .btn-toggle-preview, .btn-expand-project {
            pointer-events: auto !important;
            z-index: 40 !important;
        }
    </style>
</head>
<body class="min-h-screen bg-charcoal-950 p-3 md:p-6 text-gray-100 flex flex-col">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-50 bg-peach-500 text-charcoal-950 px-4 py-2.5 rounded-xl font-bold text-xs shadow-2xl transition-all duration-300 opacity-0 pointer-events-none -translate-y-2">
        <span id="toast-message">操作成功！</span>
    </div>

    <!-- Hidden Input for Importing Local JSON -->
    <input type="file" id="json-file-input" accept=".json" onchange="handleJsonFileImport(event)" class="hidden">
    <!-- Hidden Input for Batch Thumbnail Upload -->
    <input type="file" id="batch-thumb-input" multiple accept="image/*" onchange="handleBatchThumbUpload(event)" class="hidden">

    <div class="max-w-7xl mx-auto w-full flex-1 flex flex-col gap-5">
        
        <header class="glass-panel p-4 md:p-5 rounded-3xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center gap-2">
                    <span class="px-2.5 py-0.5 bg-peach-500/20 text-peach-400 border border-peach-500/30 rounded-md text-[11px] font-bold tracking-wider uppercase">Spatial Manager</span>
                    <h1 class="text-lg md:text-xl font-extrabold text-white">3D 面板全功能管理工具 (board_adjustment.html)</h1>
                </div>
                <p class="text-xs text-gray-400 mt-1">支援 Android (Mobile &lt; 600px) 與 平板&PC (>= 600px 雙側漸層連續縮圖) 尺寸分開配置與即時預覽切換。</p>
            </div>
            
            <div class="flex items-center gap-2 w-full md:w-auto justify-end flex-wrap">
                <button onclick="fetchLocalBoardJson()" class="bg-charcoal-900 hover:bg-white/10 border border-white/10 text-peach-300 font-semibold px-3.5 py-2 rounded-xl text-xs transition flex items-center gap-1.5">
                    載入相鄰 board_data.json
                </button>
                <button onclick="triggerJsonImport()" class="bg-charcoal-900 hover:bg-white/10 border border-white/10 text-gray-200 font-semibold px-3.5 py-2 rounded-xl text-xs transition flex items-center gap-1.5">
                    選擇本地 JSON 檔案
                </button>
                <button onclick="downloadBoardJsonData()" class="bg-peach-500 hover:bg-peach-400 active:scale-95 text-charcoal-950 font-bold px-4 py-2 rounded-xl text-xs transition flex items-center gap-1.5 shadow-lg shadow-peach-500/20">
                    下載 board_data.json
                </button>
            </div>
        </header>

        <!-- Board Selection Navigation Tabs -->
        <div class="glass-panel p-3 rounded-2xl flex flex-col gap-2">
            <div class="flex items-center justify-between px-1">
                <span class="text-xs font-bold text-peach-400 flex items-center gap-1.5">
                    <span>360 空間面板列表 (拖曳對調 360 角度定位)</span>
                </span>
                <span class="text-[11px] text-gray-400">拖曳頁籤以交換 Yaw & Pitch 定位</span>
            </div>
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="board-tabs-container">
                <!-- Draggable tabs -->
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 flex-1">
            
            <!-- Left: Real-time 3D Card Preview -->
            <div class="lg:col-span-5 flex flex-col gap-4">
                <div class="glass-panel p-5 rounded-3xl flex flex-col justify-between items-center min-h-[500px] relative overflow-hidden">
                    <div class="w-full flex justify-between items-center mb-4 border-b border-white/10 pb-3">
                        <span class="text-xs font-bold text-peach-400">3D 面板卡片即時外觀預覽</span>
                        <div class="flex items-center gap-2">
                            <button id="btn-preview-device-toggle" onclick="togglePreviewDeviceMode()" class="bg-peach-500/20 text-peach-300 border border-peach-500/40 px-2.5 py-0.5 rounded-full text-[10px] font-bold hover:bg-peach-500 hover:text-charcoal-950 transition">
                                模式: Android (&lt; 600px)
                            </button>
                            <span id="preview-board-key" class="text-[10px] font-mono bg-peach-500/20 text-peach-300 border border-peach-500/30 px-2 py-0.5 rounded-full">Key: 0_0</span>
                        </div>
                    </div>

                    <div class="w-full flex-1 flex items-center justify-center py-12">
                        <!-- Real-time Preview Node -->
                        <div id="preview-card-node" class="relative w-64 p-4 rounded-2xl text-left border border-peach-500/30 glass-card shadow-2xl">
                            <!-- Dynamically rendered preview card -->
                        </div>
                    </div>

                    <p class="text-[11px] text-gray-400 text-center w-full pt-3 border-t border-white/10">
                        點擊卡片右上角 <span class="text-peach-400 font-bold">▼</span> 按鈕可展開正方形縮圖群，平滑滑動檢視圖集
                    </p>
                </div>
            </div>

            <!-- Right: Board Parameter Form -->
            <div class="lg:col-span-7 flex flex-col gap-4">
                
                <!-- Main Editor Form -->
                <div class="glass-panel p-5 rounded-3xl flex-1 flex flex-col gap-4">
                    <div class="flex justify-between items-center border-b border-white/10 pb-3">
                        <h2 class="text-sm font-bold text-white flex items-center gap-2">
                            <span>編輯面板參數數據</span>
                            <span id="active-board-title-badge" class="text-xs text-peach-300 font-mono">0_0</span>
                        </h2>
                        <button onclick="saveCurrentBoardToMemory()" class="bg-peach-500 hover:bg-peach-400 text-charcoal-950 font-bold px-3.5 py-1.5 rounded-xl text-xs transition shadow-md">
                            套用修改並更新
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                        <div>
                            <label class="block text-gray-400 mb-1">位置 Key (Yaw_Pitch 組合)</label>
                            <input type="text" id="edit-board-key" readonly class="w-full bg-charcoal-950 border border-white/10 rounded-xl px-3 py-2 text-peach-400 font-mono opacity-80 cursor-not-allowed">
                        </div>
                        <div>
                            <label class="block text-gray-400 mb-1">球面角度 (Yaw / Pitch)</label>
                            <div class="flex gap-2">
                                <input type="number" id="edit-board-yaw" oninput="updateLivePreviewFromInput()" class="w-1/2 bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white font-mono focus:border-peach-500 focus:outline-none" placeholder="Yaw (0, 90, 180, 270)">
                                <input type="number" id="edit-board-pitch" oninput="updateLivePreviewFromInput()" class="w-1/2 bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white font-mono focus:border-peach-500 focus:outline-none" placeholder="Pitch (-30, 0, 30, 60)">
                            </div>
                        </div>
                        <div>
                            <label class="block text-peach-400 font-bold mb-1">1. 面板標題 Title (黃底黑字標籤內容)</label>
                            <input type="text" id="edit-board-title" oninput="updateLivePreviewFromInput()" class="w-full bg-charcoal-900 border border-peach-500/50 rounded-xl px-3 py-2 text-white font-bold focus:border-peach-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-gray-400 mb-1">2. 面板分類標籤 (Category)</label>
                            <input type="text" id="edit-board-category" oninput="updateLivePreviewFromInput()" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white focus:border-peach-500 focus:outline-none">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-gray-400 mb-1">3. 簡介 Description (面板主要說明文字)</label>
                            <textarea id="edit-board-desc" rows="2" oninput="updateLivePreviewFromInput()" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white focus:border-peach-500 focus:outline-none resize-none"></textarea>
                        </div>

                        <!-- 8A. Android (< 600px) 縮圖設定區域 -->
                        <div class="md:col-span-2 border-t border-peach-500/30 pt-3 bg-peach-500/5 p-3 rounded-2xl">
                            <label class="block text-peach-400 font-bold mb-2">📱 Android (Mobile &lt; 600px) 正方形縮圖排版設定</label>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                                <div>
                                    <label class="block text-gray-400 mb-1">Android 縮圖尺寸 (px)</label>
                                    <input type="number" id="edit-thumb-size-mobile" oninput="updateLivePreviewFromInput()" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white font-mono focus:border-peach-500 focus:outline-none" placeholder="64">
                                </div>
                                <div>
                                    <label class="block text-gray-400 mb-1">Android 面板間距 (px)</label>
                                    <input type="number" id="edit-thumb-margin-bottom-mobile" oninput="updateLivePreviewFromInput()" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white font-mono focus:border-peach-500 focus:outline-none" placeholder="26">
                                </div>
                                <div>
                                    <label class="block text-gray-400 mb-1">Android 漸層遮罩 (%)</label>
                                    <input type="number" id="edit-thumb-mask-percent-mobile" oninput="updateLivePreviewFromInput()" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white font-mono focus:border-peach-500 focus:outline-none" placeholder="22">
                                </div>
                                <div>
                                    <label class="block text-gray-400 mb-1">Android 縮圖寬度 (px)</label>
                                    <input type="number" id="edit-thumb-strip-width-mobile" oninput="updateLivePreviewFromInput()" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white font-mono focus:border-peach-500 focus:outline-none" placeholder="312">
                                </div>
                            </div>
                        </div>

                        <!-- 8B. 平板 & PC (>= 600px) 縮圖設定區域 -->
                        <div class="md:col-span-2 border-t border-sky-500/30 pt-3 bg-sky-500/5 p-3 rounded-2xl">
                            <label class="block text-sky-300 font-bold mb-2">💻 平板 & PC (&gt;= 600px) 兩側與中間漸層連續縮圖設定</label>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                                <div>
                                    <label class="block text-gray-400 mb-1">PC 縮圖尺寸 (px)</label>
                                    <input type="number" id="edit-thumb-size-desktop" oninput="updateLivePreviewFromInput()" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white font-mono focus:border-sky-400 focus:outline-none" placeholder="128">
                                </div>
                                <div>
                                    <label class="block text-gray-400 mb-1">PC 面板間距 (px)</label>
                                    <input type="number" id="edit-thumb-margin-bottom-desktop" oninput="updateLivePreviewFromInput()" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white font-mono focus:border-sky-400 focus:outline-none" placeholder="0">
                                </div>
                                <div>
                                    <label class="block text-gray-400 mb-1">PC 漸層遮罩 (%)</label>
                                    <input type="number" id="edit-thumb-mask-percent-desktop" oninput="updateLivePreviewFromInput()" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white font-mono focus:border-sky-400 focus:outline-none" placeholder="22">
                                </div>
                                <div>
                                    <label class="block text-gray-400 mb-1">PC 縮圖橫跨 (螢幕全寬)</label>
                                    <input type="text" readonly value="全螢幕 100vw 雙端漸層" class="w-full bg-charcoal-950 border border-white/10 rounded-xl px-3 py-2 text-sky-300 font-mono opacity-80 cursor-not-allowed">
                                </div>
                            </div>
                        </div>

                        <div class="md:col-span-2 flex items-center justify-between pt-1 border-t border-white/10">
                            <div class="flex items-center gap-2">
                                <input type="checkbox" id="edit-board-custom-html" onchange="updateLivePreviewFromInput()" class="w-4 h-4 accent-peach-500 rounded">
                                <label for="edit-board-custom-html" class="text-gray-300 font-medium">使用獨立 content.html 展示頁面 (hasCustomHtml)</label>
                            </div>
                        </div>

                        <div class="md:col-span-2 border-t border-white/10 pt-3 space-y-3">
                            <div class="flex justify-between items-center flex-wrap gap-2">
                                <div>
                                    <label class="text-peach-400 font-bold block">9. 頂部正方形縮圖群管理 (可拖曳圖片調整順序)</label>
                                    <p class="text-[10.5px] text-gray-400 mt-0.5">預覽縮圖檔名自動對應 01.jpg, 02.jpg...</p>
                                </div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <button onclick="triggerBatchThumbUpload()" class="bg-peach-500/20 hover:bg-peach-500/30 text-peach-300 border border-peach-500/40 text-[11px] px-3 py-1.5 rounded-xl font-bold transition flex items-center gap-1">
                                        ➕ 新增批次縮圖
                                    </button>
                                    <button onclick="exportAllThumbnails()" class="bg-charcoal-900 hover:bg-white/10 text-gray-200 border border-white/10 text-[11px] px-3 py-1.5 rounded-xl font-bold transition flex items-center gap-1">
                                        輸出目前所有縮圖 (PC高清打包)
                                    </button>
                                </div>
                            </div>

                            <!-- Interactive Drag-and-Drop Thumbnail Cards Grid -->
                            <div id="preimages-grid-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 max-h-64 overflow-y-auto no-scrollbar p-1 border border-white/5 bg-charcoal-950/50 rounded-2xl">
                                <!-- Dynamic thumbnail cards -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const FALLBACK_THUMB = "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=300&q=80";
        const LOCAL_STORAGE_KEY = '3D_BOARD_ADJUSTMENT_DATA';

        let previewDeviceMode = 'mobile';
        let BOARD_DATA = {};
        let activeBoardKey = "0_0";
        let draggedTabKey = null;
        let draggedThumbIdx = null;

        function togglePreviewDeviceMode() {
            previewDeviceMode = previewDeviceMode === 'mobile' ? 'desktop' : 'mobile';
            const btn = document.getElementById('btn-preview-device-toggle');
            if (btn) {
                btn.innerText = previewDeviceMode === 'mobile' ? '模式: Android (< 600px)' : '模式: 平板&PC (>= 600px 雙側)';
                btn.className = previewDeviceMode === 'mobile'
                    ? 'bg-peach-500/20 text-peach-300 border border-peach-500/40 px-2.5 py-0.5 rounded-full text-[10px] font-bold hover:bg-peach-500 hover:text-charcoal-950 transition'
                    : 'bg-sky-500/20 text-sky-300 border border-sky-500/40 px-2.5 py-0.5 rounded-full text-[10px] font-bold hover:bg-sky-400 hover:text-charcoal-950 transition';
            }
            updateLivePreviewFromInput();
        }

        function showToast(msg) {
            const toastEl = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            if (toastEl && toastMsg) {
                toastMsg.innerText = msg;
                toastEl.classList.remove('opacity-0', '-translate-y-2', 'pointer-events-none');
                toastEl.classList.add('opacity-100', 'translate-y-0');

                setTimeout(() => {
                    toastEl.classList.remove('opacity-100', 'translate-y-0');
                    toastEl.classList.add('opacity-0', '-translate-y-2', 'pointer-events-none');
                }, 2800);
            }
        }

        function updateLivePreviewCard() {
            updateLivePreviewFromInput();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('board-tabs-container');
            if (!tabsContainer) return;
            let html = '';
            const keys = Object.keys(BOARD_DATA);

            if (!BOARD_DATA[activeBoardKey]) {
                activeBoardKey = keys[0] || "0_0";
            }

            keys.forEach((key) => {
                const item = BOARD_DATA[key];
                const isActive = key === activeBoardKey;
                html += `
                    <div draggable="true"
                         data-tab-key="${key}"
                         ondragstart="handleTabDragStart(event, '${key}')"
                         ondragover="handleTabDragOver(event)"
                         ondrop="handleTabDrop(event, '${key}')"
                         ondragend="handleTabDragEnd(event)"
                         onclick="switchActiveBoard('${key}')" 
                         class="px-3.5 py-2 rounded-xl text-xs font-bold transition flex-shrink-0 flex items-center gap-1.5 border select-none cursor-grab active:cursor-grabbing ${isActive ? 'bg-peach-500 text-charcoal-950 border-peach-500 shadow-md shadow-peach-500/20' : 'text-gray-300 hover:text-white hover:bg-white/5 border-white/10'}">
                        <span class="opacity-50 text-[10px]">⋮⋮</span>
                        <span class="font-mono text-[10px] ${isActive ? 'text-charcoal-950 font-extrabold' : 'text-peach-400'}">[Yaw:${item.yaw}, Pitch:${item.pitch}]</span>
                        <span>${item.title || key}</span>
                    </div>
                `;
            });

            tabsContainer.innerHTML = html;
            fillFormValues();
            updateLivePreviewCard();
        }

        function handleTabDragStart(e, key) {
            draggedTabKey = key;
            e.currentTarget.classList.add('tab-dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleTabDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleTabDrop(e, targetKey) {
            e.preventDefault();
            if (!draggedTabKey || draggedTabKey === targetKey) return;

            saveCurrentBoardToMemory(false);

            const sourceBoard = BOARD_DATA[draggedTabKey];
            const targetBoard = BOARD_DATA[targetKey];

            const tempYaw = sourceBoard.yaw;
            const tempPitch = sourceBoard.pitch;

            sourceBoard.yaw = targetBoard.yaw;
            sourceBoard.pitch = targetBoard.pitch;
            sourceBoard.key = `${sourceBoard.yaw}_${sourceBoard.pitch}`;

            targetBoard.yaw = tempYaw;
            targetBoard.pitch = tempPitch;
            targetBoard.key = `${tempYaw}_${tempPitch}`;

            const newBoardData = {};
            Object.keys(BOARD_DATA).forEach(k => {
                if (k === draggedTabKey) {
                    newBoardData[sourceBoard.key] = sourceBoard;
                } else if (k === targetKey) {
                    newBoardData[targetBoard.key] = targetBoard;
                } else {
                    newBoardData[k] = BOARD_DATA[k];
                }
            });

            BOARD_DATA = newBoardData;
            activeBoardKey = sourceBoard.key;

            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(BOARD_DATA));
            } catch(err) {}

            renderTabs();
            showToast(`🔄 已將「${sourceBoard.title}」與「${targetBoard.title}」之 360 空間定位對調！`);
        }

        function handleTabDragEnd(e) {
            e.currentTarget.classList.remove('tab-dragging');
            draggedTabKey = null;
        }

        function switchActiveBoard(key) {
            saveCurrentBoardToMemory(false);
            activeBoardKey = key;
            renderTabs();
        }

        function fillFormValues() {
            const item = BOARD_DATA[activeBoardKey];
            if (!item) return;

            document.getElementById('edit-board-key').value = activeBoardKey;
            document.getElementById('edit-board-yaw').value = item.yaw !== undefined ? item.yaw : '';
            document.getElementById('edit-board-pitch').value = item.pitch !== undefined ? item.pitch : '';
            document.getElementById('edit-board-title').value = item.title || '';
            document.getElementById('edit-board-category').value = item.category || '';
            document.getElementById('edit-board-desc').value = item.desc || '';
            document.getElementById('edit-board-custom-html').checked = !!item.hasCustomHtml;

            // Android (Mobile < 600px)
            document.getElementById('edit-thumb-size-mobile').value = item.thumbSizeMobile !== undefined ? item.thumbSizeMobile : 64;
            document.getElementById('edit-thumb-margin-bottom-mobile').value = item.marginBottomMobile !== undefined ? item.marginBottomMobile : 26;

        function setupThumbnailTrackInteraction(node, thumbSize = 64, stripWidth = 312) {
            const track = node.querySelector('.thumb-track');
            const wrapper = node.querySelector('.board-thumbnail-strip-wrapper');
            if (!track || !wrapper) return;

            let isDragging = false;
            let startX = 0;
            let currentTranslateX = 0;
            let prevTranslateX = 0;
            let velocity = 0;
            let lastX = 0;
            let lastT = 0;
            let animRaf = null;

            function getMinMaxTranslate() {
                const wrapperWidth = wrapper.clientWidth || stripWidth;
                const trackWidth = track.scrollWidth;
                
                if (trackWidth <= wrapperWidth) {
                    const centerOffset = (wrapperWidth - trackWidth) / 2;
                    return { min: centerOffset, max: centerOffset };
                }
                const maxTranslate = 24;
                const minTranslate = wrapperWidth - trackWidth - 24;
                return { min: minTranslate, max: maxTranslate };
            }

            setTimeout(() => {
                const items = track.querySelectorAll('.thumb-item');
                if (items.length > 0) {
                    currentTranslateX = 24;
                    prevTranslateX = currentTranslateX;
                    track.style.transform = `translateX(${currentTranslateX}px)`;
                }
            }, 80);

            wrapper.onpointerdown = function(e) {
                if (e.target.closest('.btn-toggle-preview') || e.target.closest('.btn-expand-project')) return;
                e.stopPropagation();
                e.preventDefault();
                if (animRaf) cancelAnimationFrame(animRaf);

                isDragging = true;
                startX = lastX = e.clientX;
                lastT = performance.now();
                velocity = 0;
                track.style.transition = 'none';
            };

            const onPointerMoveHandler = function(e) {
                if (!isDragging) return;
                e.preventDefault();
                const deltaX = e.clientX - startX;
                let nextX = prevTranslateX + deltaX;

                const { min, max } = getMinMaxTranslate();

                if (nextX > max) {
                    nextX = max + (nextX - max) * 0.3;
                } else if (nextX < min) {
                    nextX = min + (nextX - min) * 0.3;
                }

                const now = performance.now();
                const dt = Math.max(1, now - lastT);
                velocity = 0.6 * velocity + 0.4 * ((e.clientX - lastX) / dt);
                lastX = e.clientX;
                lastT = now;

                currentTranslateX = nextX;
                track.style.transform = `translateX(${currentTranslateX}px)`;
            };

            const onPointerUpHandler = function(e) {
                if (!isDragging) return;
                isDragging = false;
                
                // Gentle controlled inertia deceleration physics
                let lastDecelTime = performance.now();
                function decelLoop() {
                    const now = performance.now();
                    const dt = Math.min(32, now - lastDecelTime);
                    lastDecelTime = now;

                    currentTranslateX += velocity * dt * 0.85;
                    velocity *= Math.pow(0.88, dt / 16);

                    const { min, max } = getMinMaxTranslate();

                    if (currentTranslateX > max) {
                        currentTranslateX += (max - currentTranslateX) * 0.18;
                        velocity *= 0.4;
                    } else if (currentTranslateX < min) {
                        currentTranslateX += (min - currentTranslateX) * 0.18;
                        velocity *= 0.4;
                    }

                    track.style.transform = `translateX(${currentTranslateX}px)`;

                    if (Math.abs(velocity) > 0.01 || currentTranslateX > max + 0.5 || currentTranslateX < min - 0.5) {
                        animRaf = requestAnimationFrame(decelLoop);
                    } else {
                        currentTranslateX = Math.max(min, Math.min(max, currentTranslateX));
                        prevTranslateX = currentTranslateX;
                        track.style.transform = `translateX(${currentTranslateX}px)`;
                    }
                }
                animRaf = requestAnimationFrame(decelLoop);
            };

            document.addEventListener('pointermove', onPointerMoveHandler);
            document.addEventListener('pointerup', onPointerUpHandler);
            document.addEventListener('pointercancel', onPointerUpHandler);
        }

        function handleBatchThumbUpload(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            const item = BOARD_DATA[activeBoardKey];
            if (!item) return;

            ensureThumbFilesSync(item);

            const yaw = item.yaw !== undefined ? item.yaw : 0;
            const pitch = item.pitch !== undefined ? item.pitch : 0;
            const baseFolder = `assets/angle_${yaw}_${pitch}/pre/`;

            let loadedCount = 0;
            files.forEach((file) => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const dataUrl = evt.target.result;
                    const nextIdx = item.preImages.length + 1;
                    const displayNum = String(nextIdx).padStart(2, '0');
                    const path = `${baseFolder}${displayNum}.jpg`;

                    item.preImages.push(path);
                    item.thumbFiles.push({ previewUrl: dataUrl, name: file.name });

                    loadedCount++;
                    if (loadedCount === files.length) {
                        renderPreImagesGrid();
                        updateLivePreviewFromInput();
                        saveCurrentBoardToMemory(false);
                        showToast(`已新增 ${files.length} 張縮圖！已更新本地紀錄`);

                reader.readAsDataURL(file);
            });

            e.target.value = '';

            const item = BOARD_DATA[activeBoardKey];

            ensureThumbFilesSync(item);

            const movedImg = item.preImages.splice(draggedThumbIdx, 1)[0];

        function fetchRawBlob(src) {
            return new Promise((resolve) => {
                if (!src) return resolve(null);
                if (src.startsWith('data:')) {
                    try {
                        const parts = src.split(',');
                        const mime = parts[0].match(/:(.*?);/)?.[1] || 'image/jpeg';
                        const bstr = atob(parts[1]);
                        let n = bstr.length;
                        const u8arr = new Uint8Array(n);
                        while (n--) {
                            u8arr[n] = bstr.charCodeAt(n);
                        }
                        resolve(new Blob([u8arr], { type: mime }));
                    } catch(e) {
                        resolve(null);
                    }
                    return;
                }
                fetch(src)
                    .then(res => res.ok ? res.blob() : null)
                    .then(blob => resolve(blob))
                    .catch(() => resolve(null));
            });
        }

        function createPlaceholderSquareBlob(text, targetSize = 256) {
            return new Promise((resolve) => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = targetSize;
                    canvas.height = targetSize;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = "#232327";
                    ctx.fillRect(0, 0, targetSize, targetSize);
                    ctx.fillStyle = "#fcd191";
                    ctx.font = `bold ${Math.round(targetSize * 0.22)}px sans-serif`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(text || "Thumb", targetSize / 2, targetSize / 2);
                    canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.9);
                } catch(e) {
                    resolve(null);
                }
            });
        }

        function fetchSquareBlob(src, targetSize = 256) {
            return new Promise((resolve) => {
                if (!src) return resolve(null);

                let resolved = false;
                const safeResolve = (res) => {
                    if (!resolved) {
                        resolved = true;
                        resolve(res);
                    }
                };

                const timer = setTimeout(() => {
                    fetchRawBlob(src).then(blob => {
                        if (blob) safeResolve(blob);
                        else createPlaceholderSquareBlob("Thumb", targetSize).then(safeResolve);
                    });
                }, 2500);

                const img = new Image();
                if (!src.startsWith('data:')) {
                    img.crossOrigin = "anonymous";
                }

                img.onload = function() {
                    clearTimeout(timer);
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = targetSize;
                        canvas.height = targetSize;
                        const ctx = canvas.getContext('2d');

                        ctx.fillStyle = "#1c1c1f";
                        ctx.fillRect(0, 0, targetSize, targetSize);

                        const aspect = img.width / Math.max(1, img.height);
                        let sw, sh, sx, sy;
                        if (aspect > 1) {
                            sh = img.height;
                            sw = img.height;
                            sx = (img.width - img.height) / 2;
                            sy = 0;
                        } else {
                            sw = img.width;
                            sh = img.width;
                            sx = 0;
                            sy = (img.height - img.width) / 2;
                        }

                        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetSize, targetSize);

                        canvas.toBlob((blob) => {
                            if (blob) {
                                safeResolve(blob);
                            } else {
                                fetchRawBlob(src).then(safeResolve);
                            }
                        }, 'image/jpeg', 0.92);
                    } catch (e) {
                        fetchRawBlob(src).then(blob => {
                            if (blob) safeResolve(blob);
                            else createPlaceholderSquareBlob("Thumb", targetSize).then(safeResolve);
                        });
                    }
                };

                img.onerror = function() {
                    clearTimeout(timer);
                    fetchRawBlob(src).then(blob => {
                        if (blob) safeResolve(blob);
                        else createPlaceholderSquareBlob("Thumb", targetSize).then(safeResolve);
                    });
                };

                img.src = src;
            });
        }

        async function exportAllThumbnails() {
            const item = BOARD_DATA[activeBoardKey];
            if (!item || !item.preImages || item.preImages.length === 0) {
                showToast("⚠️ 目前沒有可輸出的縮圖");
                return;
            }

            if (typeof JSZip === 'undefined') {
                showToast("⚠️ JSZip 程式庫正在載入中，請稍後再試");
                return;
            }

            ensureThumbFilesSync(item);

            const yaw = item.yaw !== undefined ? item.yaw : 0;
            const pitch = item.pitch !== undefined ? item.pitch : 0;
            const pcThumbSize = item.thumbSizeDesktop || 128;

            showToast("⏳ 正在製作 PC 高清縮圖打包 ZIP 檔案...");

            try {
                const zip = new JSZip();

                for (let i = 0; i < item.preImages.length; i++) {
                    const localObj = item.thumbFiles[i];
                    const imgSrc = (localObj && localObj.previewUrl) ? localObj.previewUrl : item.preImages[i];
                    const displayNum = String(i + 1).padStart(2, '0');
                    const fileName = `${displayNum}.jpg`;

                    let blob = await fetchSquareBlob(imgSrc, pcThumbSize * 2);
                    if (!blob) {
                        blob = await createPlaceholderSquareBlob(`#${displayNum}`, pcThumbSize * 2);
                    }
                    if (blob) {
                        zip.file(fileName, blob);
                    }
                }

                const content = await zip.generateAsync({ type: "blob" });
                const zipFileName = `angle_${yaw}_${pitch}_pre_thumbnails_hd.zip`;
                const a = document.createElement('a');
                a.href = URL.createObjectURL(content);
                a.download = zipFileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                showToast(`📦 縮圖已成功以 PC 高清規格打包下載為 ${zipFileName}！`);

                setTimeout(() => {
                    downloadBoardJsonData();
                }, 500);
            } catch (err) {
                console.error("Export thumbnails error:", err);
                showToast("⚠️ 打包縮圖時發生錯誤，請重試");
            }
        }

        function downloadBoardJsonData() {
            saveCurrentBoardToMemory(false);

            const exportPanels = Object.keys(BOARD_DATA).map(key => {
                const item = BOARD_DATA[key];
                const yaw = item.yaw;
                const pitch = item.pitch;
                const folder = item.folder || `assets/angle_${key}/`;
                const preFolder = item.preFolder || `${folder}pre/`;

                return {
                    key: item.key || key,
                    yaw: yaw,
                    pitch: pitch,
                    position: {
                        yaw: yaw,
                        pitch: pitch,
                        note: "面板中心點對應的球面角度 (yaw=水平, pitch=垂直)"
                    },
                    title: item.title || '',
                    category: item.category || '',
                    desc: item.desc || '',
                    folder: folder,
                    hasCustomHtml: !!item.hasCustomHtml,
                    detailFilePath: item.detailFilePath || `${folder}content.html`,
                    boardLink: item.boardLink || folder,
                    previewImage: item.previewImage || `${folder}preview.jpg`,
                    thumbSizeMobile: item.thumbSizeMobile !== undefined ? item.thumbSizeMobile : 64,
                    stripWidthMobile: item.stripWidthMobile !== undefined ? item.stripWidthMobile : 312,
                    marginBottomMobile: item.marginBottomMobile !== undefined ? item.marginBottomMobile : 26,
                    maskPercentMobile: item.maskPercentMobile !== undefined ? item.maskPercentMobile : 22,
                    thumbSizeDesktop: item.thumbSizeDesktop !== undefined ? item.thumbSizeDesktop : 128,
                    stripWidthDesktop: item.stripWidthDesktop !== undefined ? item.stripWidthDesktop : 0,
                    marginBottomDesktop: item.marginBottomDesktop !== undefined ? item.marginBottomDesktop : 0,
                    maskPercentDesktop: item.maskPercentDesktop !== undefined ? item.maskPercentDesktop : 22,
                    preFolder: preFolder,
                    preImages: item.preImages || [],
                    images: item.images || []
                };
            });

            const exportObj = {
                _readme: "index.html 會讀取此檔顯示所有面板。包含 Android (<600px) 與 平板&PC (>=600px 雙側展演) 獨立相應設定。",
                version: 2,
                panels: exportPanels
            };

            const jsonStr = JSON.stringify(exportObj, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'board_data.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("📄 已成功下載最新 Version 2 規格之 board_data.json！");
        }

        async function fetchLocalBoardJson() {
            const pathsToTry = ['board_data.json', './board_data.json', 'assets/board_data.json'];
            let loadedData = null;
            for (const path of pathsToTry) {
                try {
                    const res = await fetch(path, { cache: 'no-store' });
                    if (res.ok) {
                        loadedData = await res.json();
                        break;
                    }
                } catch (e) {}
            }

            if (loadedData) {
                normalizeAndLoadBoardData(loadedData, true);
                showToast("✅ 已成功載入相鄰 board_data.json！");
            } else {
                showToast("⚠️ 未存取到相鄰 JSON，請手動選擇檔案匯入");
            }
        }

        function normalizeAndLoadBoardData(rawJson, saveToLocal = false) {
            if (!rawJson) return;

            let normalized = {};
            let panelList = Array.isArray(rawJson.panels) ? rawJson.panels : (typeof rawJson === 'object' ? Object.values(rawJson) : []);

            if (panelList.length > 0) {
                panelList.forEach(p => {
                    if (typeof p !== 'object' || !p) return;
                    const key = p.key || `${p.yaw}_${p.pitch}`;
                    const yaw = p.yaw !== undefined ? p.yaw : Number(key.split('_')[0]);
                    const pitch = p.pitch !== undefined ? p.pitch : Number(key.split('_')[1]);
                    const folder = p.folder || `assets/angle_${key}/`;
                    const preFolder = p.preFolder || `${folder}pre/`;

                    let preImages = Array.isArray(p.preImages) && p.preImages.length > 0
                        ? p.preImages
                        : [
                            `${preFolder}01.jpg`,
                            `${preFolder}02.jpg`,
                            `${preFolder}03.jpg`,
                            `${preFolder}04.jpg`,
                            `${preFolder}05.jpg`
                        ];

                    normalized[key] = {
                        key: key,
                        yaw: yaw,
                        pitch: pitch,
                        title: p.title || '',
                        category: p.category || '',
                        desc: p.desc || '',
                        folder: folder,
                        hasCustomHtml: !!p.hasCustomHtml,
                        detailFilePath: p.detailFilePath || p.link || `${folder}content.html`,
                        link: p.link || p.detailFilePath || `${folder}content.html`,
                        previewImage: p.previewImage || `${folder}preview.jpg`,
                        thumbSizeMobile: p.thumbSizeMobile !== undefined ? Number(p.thumbSizeMobile) : (p.thumbSize || 64),
                        stripWidthMobile: p.stripWidthMobile !== undefined ? Number(p.stripWidthMobile) : (p.stripWidth || 312),
                        marginBottomMobile: p.marginBottomMobile !== undefined ? Number(p.marginBottomMobile) : (p.marginBottom || 26),
                        maskPercentMobile: p.maskPercentMobile !== undefined ? Number(p.maskPercentMobile) : (p.maskPercent || 22),
                        thumbSizeDesktop: p.thumbSizeDesktop !== undefined ? Number(p.thumbSizeDesktop) : (p.thumbSizeMobile ? p.thumbSizeMobile * 2 : 128),
                        stripWidthDesktop: p.stripWidthDesktop !== undefined ? Number(p.stripWidthDesktop) : 0,
                        marginBottomDesktop: p.marginBottomDesktop !== undefined ? Number(p.marginBottomDesktop) : 0,
                        maskPercentDesktop: p.maskPercentDesktop !== undefined ? Number(p.maskPercentDesktop) : 22,
                        preFolder: preFolder,
                        preImages: preImages,
                        images: Array.isArray(p.images) ? p.images : []
                    };
                });
            }

            if (Object.keys(normalized).length > 0) {
                BOARD_DATA = normalized;
                if (saveToLocal) {
                    try {
                        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(BOARD_DATA));
                    } catch(e) {}
                }
                renderTabs();
            }
        }

        function triggerJsonImport() {
            document.getElementById('json-file-input').click();
        }

        function handleJsonFileImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const jsonData = JSON.parse(evt.target.result);
                    normalizeAndLoadBoardData(jsonData, true);
                    showToast("✅ 已成功匯入 JSON 並更新紀錄！");
                } catch (err) {
                    showToast("⚠️ JSON 解析失敗");
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        window.onload = function() {
            const localSaved = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (localSaved) {
                try {
                    const parsed = JSON.parse(localSaved);
                    if (parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0) {
                        normalizeAndLoadBoardData(parsed, false);
                        showToast("✅ 已成功讀取 LocalStorage 狀態！");
                        return;
                    }
                } catch (e) {}
            }

            fetchLocalBoardJson().then(() => {
                renderTabs();
            }).catch(() => {
                renderTabs();
            });
        };
    </script>
</body>
</html>
