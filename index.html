<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <title>360° Spatial Portfolio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        peach: {
                            300: '#fde5be',
                            400: '#fcd8a0',
                            500: '#fcd191',
                            600: '#e0b879',
                        },
                        charcoal: {
                            800: '#2c2c31',
                            850: '#232327',
                            900: '#1c1c1f',
                            950: '#141416',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            background-color: #141416;
            color: #f3f4f6;
            touch-action: none;
        }
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            cursor: grab;
            touch-action: none;
            overflow: hidden;
        }
        /* canvas 尺寸交給 CSS，避免轉向時舊的 px 寬度撐大版面，手機瀏覽器因此整頁縮小 */
        #webgl-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        #webgl-container:active {
            cursor: grabbing;
        }
        .glass-panel {
            background: linear-gradient(180deg, rgba(35, 35, 39, 0.90) 0%, rgba(35, 35, 39, 0.60) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: linear-gradient(180deg, rgba(35, 35, 39, 0.80) 0%, rgba(35, 35, 39, 0.40) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(252, 209, 145, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        /* 開啟作品面板時，解除全域 touch-action:none，讓面板內的縮圖列可以原生橫向滑動 */
        html.modal-open, html.modal-open body {
            touch-action: auto;
        }
        #modal-details {
            touch-action: manipulation;
            overscroll-behavior: contain;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .spatial-node {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 16rem;
            aspect-ratio: 1 / 2;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 節點外框(256x512)本身不吃事件，只讓卡片吃，避免相鄰面板的透明外框蓋住當前縮圖列中段 */
            pointer-events: none;
            will-change: transform;
            transition: border-color 0.2s ease, background-color 0.2s ease, opacity 0.15s ease;
            touch-action: none;
        }

        /* Frameless Thumbnail Strip Overlay Styles */
        .thumb-strip {
            position: absolute;
            display: none;
            will-change: transform, opacity;
            z-index: 35;
            touch-action: none;
            cursor: grab;
            pointer-events: auto !important;
            background: transparent;
            border: none;
            box-shadow: none;
            overflow: hidden;
        }
        
        .thumb-strip.is-mobile {
            left: 50%;
            bottom: 100%;
            transform-origin: 50% 100%;
        }

        .thumb-strip.is-desktop {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-origin: 50% 50%;
        }

        .thumb-strip.dragging { cursor: grabbing; }
        
        .thumb-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: auto !important;
            touch-action: none;
        }
        .thumb-track {
            position: absolute;
            top: 6px;
            left: 0;
            display: flex;
            gap: 12px;
            will-change: transform;
            pointer-events: auto !important;
            touch-action: none;
        }
        .thumb-item {
            flex: 0 0 auto;
            border-radius: 14px;
            overflow: hidden;
            border: 1.5px solid rgba(252, 209, 145, 0.6);
            background: #1c1c1f;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            will-change: transform;
            pointer-events: auto !important;
            touch-action: none;
        }
        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
            -webkit-user-drag: none;
            user-select: none;
        }
    </style>
</head>
<body class="h-full font-sans antialiased overflow-hidden">

    <!-- 360 Canvas Container -->
    <div id="webgl-container"></div>

    <!-- 3D Spatial Fixed Hotspot Cards Layer -->
    <div id="spatial-panels-container" class="absolute inset-0 z-10 pointer-events-none overflow-hidden touch-none">
        <!-- 3D Spatial cards projected dynamically -->
    </div>

    <!-- UI Overlay HUD Layer -->
    <div id="ui-hud-overlay" class="relative z-20 pointer-events-none w-full h-full flex flex-col justify-between p-4 md:p-6 transition-opacity duration-300">
        
        <!-- Top Navigation HUD -->
        <header class="flex justify-end items-center w-full max-w-7xl mx-auto pointer-events-auto">
            <button id="toggle-ui-btn" class="glass-panel px-4 py-2 rounded-2xl text-xs font-semibold text-gray-200 hover:text-white hover:bg-white/10 transition flex items-center gap-2 shadow-xl border border-peach-500/30">
                <span id="toggle-ui-text">隱藏 UI 介面</span>
            </button>
        </header>

        <!-- Bottom Section Navigation Bar -->
        <footer id="hud-footer" class="w-full max-w-6xl mx-auto pointer-events-auto flex flex-col items-center">
            <button id="toggle-nav-btn" class="glass-panel px-6 py-1.5 rounded-t-2xl text-gray-300 hover:text-white flex items-center justify-center gap-2 shadow-xl cursor-pointer border-b-0 -mb-[1px] z-10 transition-all hover:bg-white/10 active:scale-95" title="收折/展開選單">
                <div class="w-8 h-1 bg-peach-500/70 rounded-full"></div>
                <span id="toggle-nav-icon" class="text-[10px] text-peach-400 font-bold">▼</span>
            </button>

            <div id="nav-content-wrapper" class="w-full flex flex-col items-center gap-2 transition-all duration-300 ease-in-out max-h-[350px] opacity-100 overflow-hidden">
                <div class="text-[11px] text-gray-400 flex items-center gap-1.5 glass-panel px-3.5 py-1 rounded-full border border-white/5">
                    <span>隨意拖曳 360° 空間，自動開啟當前主題預覽圖</span>
                </div>

                <div class="glass-panel p-2 rounded-2xl flex flex-wrap justify-center items-center gap-1.5 shadow-2xl max-w-full overflow-x-auto no-scrollbar">
                    <span class="text-xs text-peach-400 font-semibold px-2 hidden lg:inline border-r border-white/10">快速切換：</span>

                    <!-- 依 board_data.json 自動產生，見 setupNavigationButtons() -->
                    <div id="nav-buttons-container" class="contents"></div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Modal Detail Container -->
    <!-- 高度用 JS 量到的「實際可視高度」(--app-h)，避免 Android 網址列蓋住頂部按鈕 -->
    <div id="modal-details" style="height: var(--app-h, 100dvh); bottom: auto;" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 opacity-0 pointer-events-none hidden transition-opacity duration-300">
        <div style="height: calc(var(--app-h, 100dvh) * 0.97); max-height: 100%;" class="w-full max-w-[1536px] flex flex-col relative overflow-hidden" id="modal-detail-content">
            <!-- content.html is injected here cleanly -->
        </div>
    </div>

    <script>
        let PORTFOLIO_DATA = {};
        const YAW_TARGETS = [0, 90, 180, 270];
        const PITCH_TARGETS = [-60, -30, 0, 30, 60];
        const THUMB_GAP = 12;

        let container, scene, camera, renderer, sphereMesh;
        let isUserInteracting = false;
        let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
        let onPointerDownLon = 0, onPointerDownLat = 0;
        let pointerMoveDistance = 0;

        let lon = 0, lat = 0;
        let targetLon = 0, targetLat = 0;
        let isSnapping = false;

        let activePanelKey = "0_0";

        const spatialDomNodes = {};

        /* ---------- 實際可視高度（處理 Android 網址列伸縮） ---------- */
        function setAppHeight() {
            const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
            document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
        }
        setAppHeight();
        window.addEventListener('resize', setAppHeight);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);

        // 版面實際寬高：用 documentElement.clientWidth/Height，不用 innerWidth
        // (innerWidth 在手機上會被溢出的內容撐大，轉向回直式後就回不去)
        function getViewSize() {
            const de = document.documentElement;
            return {
                w: de.clientWidth || window.innerWidth,
                h: de.clientHeight || window.innerHeight
            };
        }

        // 手機轉向時部分瀏覽器 (iOS Safari) 的尺寸會晚一點才更新，
        // 轉向後分兩次補發 resize，讓 360° 畫面與作品面板 (content.html) 都依最終尺寸重排
        window.addEventListener('orientationchange', () => {
            [250, 600].forEach(ms => setTimeout(() => {
                setAppHeight();
                window.dispatchEvent(new Event('resize'));
            }, ms));
        });

        /* ---------- 背景依序預載各 yaw/pitch 面板的作品圖片 ---------- */
        const BgPreloader = (function () {
            const done = new Set();
            const inflight = new Map();
            const IMG_RE = /\.(?:jpe?g|png|webp|gif|avif)(?:\?.*)?$/i;

            function loadOne(url) {
                if (done.has(url)) return Promise.resolve(true);
                if (inflight.has(url)) return inflight.get(url);
                const p = new Promise(resolve => {
                    const img = new Image();
                    img.decoding = 'async';
                    img.onload = () => { done.add(url); inflight.delete(url); resolve(true); };
                    img.onerror = () => { done.add(url); inflight.delete(url); resolve(false); };
                    img.src = url;
                });
                inflight.set(url, p);
                return p;
            }

            async function collectUrls(item) {
                const urls = new Set();
                const add = u => { if (typeof u === 'string' && IMG_RE.test(u)) urls.add(u); };
                const walk = o => {
                    if (typeof o === 'string') add(o);
                    else if (Array.isArray(o)) o.forEach(walk);
                    else if (o && typeof o === 'object') {
                        // 有壓縮圖 (web) 時只預載壓縮圖，不預載原圖 (src)
                        Object.keys(o).forEach(k => {
                            if (k === 'fallback' || k === 'bgFallback') return;
                            if (k === 'src' && o.web) return;
                            walk(o[k]);
                        });
                    }
                };
                let gotJson = false;
                try {
                    const r = await fetch((item.folder || '') + 'portfolio_data.json');
                    if (r.ok) { walk(await r.json()); gotJson = urls.size > 0; }
                } catch (e) {}
                if (!gotJson) {
                    try {
                        const r = await fetch(item.detailFilePath || ((item.folder || '') + 'content.html'));
                        if (r.ok) {
                            const text = await r.text();
                            const re = /["']((?:\.\/|\/)?assets\/[^"'\s]+?\.(?:jpe?g|png|webp|gif|avif))["']/gi;
                            let m;
                            while ((m = re.exec(text))) add(m[1]);
                        }
                    } catch (e) {}
                }
                return Array.from(urls);
            }

            const sleep = ms => new Promise(r => setTimeout(r, ms));

            async function run(orderedKeys) {
                const conn = navigator.connection;
                if (conn && conn.saveData) return; // 使用者開啟省流量模式就不預載
                for (const key of orderedKeys) {
                    const item = PORTFOLIO_DATA[key];
                    if (!item || !item.hasCustomHtml) continue;
                    const urls = await collectUrls(item);
                    let i = 0;
                    const worker = async () => {
                        while (i < urls.length) {
                            // 使用者正在拖曳全景或開著作品面板時暫停，不搶頻寬
                            while (isUserInteracting || document.documentElement.classList.contains('modal-open')) await sleep(300);
                            const u = urls[i++];
                            await loadOne(u);
                            await sleep(40);
                        }
                    };
                    await Promise.all([worker(), worker()]);
                }
            }

            function start() {
                const keys = Object.keys(PORTFOLIO_DATA);
                const ordered = [activePanelKey, ...keys.filter(k => k !== activePanelKey)];
                const go = () => run(ordered);
                if (window.requestIdleCallback) window.requestIdleCallback(go, { timeout: 4000 });
                else setTimeout(go, 1500);
            }

            return { start, loadOne };
        })();

        function isDesktopViewport() {
            return getViewSize().w >= 600;
        }

        function makeDefaultThumbs() {
            return [
                'https://placehold.co/300x300/1c1c1f/fcd191?text=Preview+01',
                'https://placehold.co/300x300/1c1c1f/fcd191?text=Preview+02',
                'https://placehold.co/300x300/1c1c1f/fcd191?text=Preview+03'
            ];
        }

        async function loadBoardData() {
            try {
                const res = await fetch('board_data.json', { cache: 'no-store' });
                if (!res.ok) throw new Error('board_data.json not found');
                const json = await res.json();

                let normalized = {};
                if (Array.isArray(json.panels)) {
                    json.panels.forEach(p => {
                        // 一律用 yaw_pitch 當 key（例如 0_-30），拖曳吸附時算出的 key 才對得上
                        const key = (p.yaw !== undefined && p.pitch !== undefined) ? `${p.yaw}_${p.pitch}` : p.key;
                        normalized[key] = p;
                    });
                } else if (json && typeof json === 'object') {
                    normalized = json;
                }

                if (Object.keys(normalized).length > 0) {
                    Object.keys(normalized).forEach(k => {
                        const it = normalized[k];
                        const [ky, kp] = k.split('_').map(Number);
                        if (it.yaw === undefined) it.yaw = ky;
                        if (it.pitch === undefined) it.pitch = kp;
                        const base = `assets/angle_${it.yaw}_${it.pitch}/`;
                        it.folder = it.folder || base;
                        it.detailFilePath = it.detailFilePath || base + 'content.html';
                        it.boardLink = it.boardLink || base;
                        it.previewImage = it.previewImage || base + 'preview.jpg';

                        it.previewImageWidth = it.previewImageWidth || (it.previewImageSize && it.previewImageSize.width) || 208;
                        it.previewImageHeight = it.previewImageHeight || (it.previewImageSize && it.previewImageSize.height) || 208;
                        it.previewImageSize = { width: it.previewImageWidth, height: it.previewImageHeight };

                        // Android (Mobile < 600px) Parameter Normalization
                        it.thumbSizeMobile = it.thumbSizeMobile !== undefined ? Number(it.thumbSizeMobile) : (it.thumbSize || 64);
                        it.stripWidthMobile = it.stripWidthMobile !== undefined ? Number(it.stripWidthMobile) : (it.stripWidth || 312);
                        it.marginBottomMobile = it.marginBottomMobile !== undefined ? Number(it.marginBottomMobile) : (it.marginBottom || 26);
                        it.maskPercentMobile = it.maskPercentMobile !== undefined ? Number(it.maskPercentMobile) : (it.maskPercent || 22);

                        // Tablet & PC (Desktop >= 600px) Parameter Normalization
                        it.thumbSizeDesktop = it.thumbSizeDesktop !== undefined ? Number(it.thumbSizeDesktop) : (it.thumbSizeMobile * 2);
                        it.stripWidthDesktop = it.stripWidthDesktop !== undefined ? Number(it.stripWidthDesktop) : 0; // 0 represents full viewport width
                        it.marginBottomDesktop = it.marginBottomDesktop !== undefined ? Number(it.marginBottomDesktop) : 0;
                        it.maskPercentDesktop = it.maskPercentDesktop !== undefined ? Number(it.maskPercentDesktop) : 22;

                        // 開啟當前主題預覽圖 (預設開啟)；關閉時不顯示縮圖列與展開/縮回按鈕
                        it.showPreviewStrip = it.showPreviewStrip !== false;

                        // 施工中 (預設關閉)；開啟時「作品細節」按鈕改為施工中，且不開啟作品細節
                        it.underConstruction = !!it.underConstruction;

                        it.preFolder = it.preFolder || base + 'pre/';
                        it.images = Array.isArray(it.images) ? it.images : [];
                        it.title = it.title || '';
                        it.desc = it.desc || '';
                        it.category = it.category || it.title;
                    });
                    PORTFOLIO_DATA = normalized;
                }
            } catch (err) {
                console.log('[board_data.json] 使用預設全景與面板設定。');
            }
        }

        async function init() {
            await loadBoardData();

            container = document.getElementById('webgl-container');
            const initSize = getViewSize();
            camera = new THREE.PerspectiveCamera(75, initSize.w / initSize.h, 1, 1100);
            scene = new THREE.Scene();

            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);

            const defaultTexture = new THREE.CanvasTexture(generateDefaultPanoCanvas());
            const material = new THREE.MeshBasicMaterial({ map: defaultTexture });

            sphereMesh = new THREE.Mesh(geometry, material);
            scene.add(sphereMesh);

            const textureLoader = new THREE.TextureLoader();
            textureLoader.load(
                'assets/pano_bg.jpg',
                function (loadedTexture) {
                    material.map = loadedTexture;
                    material.needsUpdate = true;
                },
                undefined,
                function () {
                    console.log('使用預設網格全景底圖。');
                }
            );

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(initSize.w, initSize.h, false);
            container.appendChild(renderer.domElement);

            createSpatialPanelElements();

            container.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('resize', onWindowResize);

            setupNavigationButtons();
            setupUIToggleButton();
            snapToNearestAngle();
            animate();
            BgPreloader.start();
        }

        function generateDefaultPanoCanvas() {
            const canvas = document.createElement('canvas');
            canvas.width = 4096;
            canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#141416');
            grad.addColorStop(0.5, '#232327');
            grad.addColorStop(1, '#141416');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < 360; i += 15) {
                const x = (i / 360) * canvas.width;
                ctx.beginPath();
                if (i % 90 === 0) {
                    ctx.strokeStyle = 'rgba(252, 209, 145, 0.35)';
                    ctx.lineWidth = 6;
                } else {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                    ctx.lineWidth = 2;
                }
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            const pitchAngles = [-60, -30, 0, 30, 60];
            pitchAngles.forEach(p => {
                const y = ((90 - p) / 180) * canvas.height;
                ctx.beginPath();
                ctx.strokeStyle = p === 0 ? 'rgba(252, 209, 145, 0.45)' : 'rgba(255, 255, 255, 0.06)';
                ctx.lineWidth = p === 0 ? 5 : 2;
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            });

            return canvas;
        }

        function escapeHTML(str) {
            return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        const ICON_EXPAND = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l4-4 4 4"/></svg>';
        const ICON_COLLAPSE = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l4 4 4-4"/></svg>';

        function updateNodeCardHTML(node, item) {
            node.innerHTML = `
                <div class="main-card-content glass-card p-4 rounded-2xl w-full text-left border border-peach-500/30 hover:border-peach-500 cursor-pointer shadow-2xl relative z-10">
                    <div class="absolute -top-3 left-5 bg-peach-500 text-charcoal-950 font-extrabold text-[11px] px-2.5 py-0.5 rounded-full shadow-md z-40 pointer-events-none truncate max-w-[150px]">
                        ${escapeHTML(item.title)}
                    </div>

                    ${item.showPreviewStrip !== false ? `<button class="btn-toggle-preview absolute -top-3 right-5 w-6 h-6 rounded-full bg-charcoal-900 border border-peach-500/50 text-peach-300 hover:bg-peach-500 hover:text-charcoal-950 flex items-center justify-center shadow-lg z-40 transition cursor-pointer pointer-events-auto" title="展開縮圖">
                        ${ICON_EXPAND}
                    </button>

                    <!-- Thumbnail Strip Container -->
                    <div class="thumb-strip">
                        <div class="thumb-viewport">
                            <div class="thumb-track"></div>
                        </div>
                    </div>` : ''}

                    <p class="text-gray-200 text-xs line-clamp-3 mb-3 leading-relaxed pt-1 w-full">
                        ${escapeHTML(item.desc)}
                    </p>
                    <div class="pt-2 border-t border-white/10 text-xs font-semibold relative z-40">
                        <button class="btn-expand-project w-full bg-peach-500 hover:bg-peach-400 text-charcoal-950 py-1.5 px-3 rounded-xl transition flex items-center justify-center gap-1.5 shadow-lg shadow-peach-500/20 font-bold relative z-40 pointer-events-auto ${item.underConstruction ? 'opacity-80 cursor-not-allowed' : ''}">
                            ${item.underConstruction ? '🚧 施工中 🚧' : '作品細節'}
                        </button>
                    </div>
                </div>
            `;
        }

        function createSpatialPanelElements() {
            const containerOverlay = document.getElementById('spatial-panels-container');
            containerOverlay.innerHTML = '';

            Object.keys(PORTFOLIO_DATA).forEach(key => {
                const item = PORTFOLIO_DATA[key];
                const [yaw, pitch] = (item.yaw !== undefined && item.pitch !== undefined) ? [Number(item.yaw), Number(item.pitch)] : key.split('_').map(Number);

                const node = document.createElement('div');
                node.className = 'spatial-node w-64 aspect-[1/2] flex items-center justify-center';
                node.dataset.key = key;

                updateNodeCardHTML(node, item);

                node.addEventListener('pointerdown', (e) => {
                    if (e.target.closest('.btn-expand-project') || e.target.closest('.btn-toggle-preview') || e.target.closest('.thumb-strip')) {
                        e.stopPropagation();
                        return;
                    }
                    onPointerDown(e);
                });

                const expandBtn = node.querySelector('.btn-expand-project');
                if (expandBtn) {
                    expandBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
                    expandBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        if (item.underConstruction) return;
                        openProjectDetailModal(key);
                    });
                }

                setupThumbStripController(node, key, item, yaw, pitch);

                node.addEventListener('click', (e) => {
                    if (pointerMoveDistance > 8) return;
                    if (e.target.closest('.btn-expand-project') || e.target.closest('.btn-toggle-preview') || e.target.closest('.thumb-strip')) return;

                    targetLon = getTargetLonForYaw(lon, yaw);
                    targetLat = pitch;
                    isSnapping = true;
                    updateActivePanelAndPreviews(key, yaw, pitch);
                });

                containerOverlay.appendChild(node);
                // 保留 setupThumbStripController 先寫入的 controller，否則縮圖列不會自動展開
                spatialDomNodes[key] = Object.assign(spatialDomNodes[key] || {}, {
                    element: node,
                    yaw: yaw,
                    pitch: pitch
                });
            });
        }

        function loadImageOk(url) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        const naturalSort = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });

        async function resolvePreImages(item, yaw, pitch) {
            const folder = item.preFolder || `assets/angle_${yaw}_${pitch}/pre/`;
            let candidates = [];

            if (Array.isArray(item.preImages) && item.preImages.length) {
                candidates = item.preImages.map(n => /^(https?:|data:|\/|assets\/)/.test(n) ? n : folder + n);
            }

            if (!candidates.length) {
                try {
                    const res = await fetch(folder, { cache: 'no-store' });
                    if (res.ok) {
                        const text = await res.text();
                        const re = /href\s*=\s*["']([^"'#?]+\.(?:jpe?g|png))["']/gi;
                        const found = [];
                        let m;
                        while ((m = re.exec(text))) {
                            const name = decodeURIComponent(m[1]).split('/').pop();
                            found.push(name);
                        }
                        candidates = Array.from(new Set(found)).sort(naturalSort).map(n => folder + encodeURIComponent(n));
                    }
                } catch (e) { }
            }

            if (!candidates.length) {
                const names = [];
                for (let i = 1; i <= 12; i++) {
                    [String(i), String(i).padStart(2, '0')].forEach(b => {
                        ['jpg', 'png'].forEach(ext => names.push(`${folder}${b}.${ext}`));
                    });
                }
                const ok = await Promise.all(names.map(loadImageOk));
                candidates = names.filter((_, i) => ok[i]);
            } else {
                const ok = await Promise.all(candidates.map(loadImageOk));
                candidates = candidates.filter((_, i) => ok[i]);
            }

            return candidates;
        }

        function setupThumbStripController(node, key, item, yaw, pitch) {
            const btn = node.querySelector('.btn-toggle-preview');
            const strip = node.querySelector('.thumb-strip');
            const viewport = node.querySelector('.thumb-viewport');
            const track = node.querySelector('.thumb-track');
            if (!btn || !strip || !viewport || !track) return;

            const st = {
                images: null, items: [], pos: 0, target: 0, min: 0, max: 0,
                dragging: false, open: false, busy: false, anim: null, animRaf: null,
                startX: 0, startPos: 0, lastX: 0, lastT: 0, vel: 0,
                openStrip: null, closeStrip: null, rebuildLayout: null
            };

            function stopInertiaAnimation() {
                if (st.animRaf) {
                    cancelAnimationFrame(st.animRaf);
                    st.animRaf = null;
                }
            }

            function updateDimensionsAndLayout() {
                const isDesktop = isDesktopViewport();
                
                // Read exact values recorded in board_data.json for both modes
                const thumbSize = isDesktop 
                    ? (item.thumbSizeDesktop !== undefined ? Number(item.thumbSizeDesktop) : 128) 
                    : (item.thumbSizeMobile !== undefined ? Number(item.thumbSizeMobile) : 64);
                
                const stripWidthMobile = item.stripWidthMobile !== undefined ? Number(item.stripWidthMobile) : 312;
                const marginBottomMobile = item.marginBottomMobile !== undefined ? Number(item.marginBottomMobile) : 26;
                const maskPercentMobile = item.maskPercentMobile !== undefined ? Number(item.maskPercentMobile) : 22;

                const stripWidthDesktop = (item.stripWidthDesktop !== undefined && Number(item.stripWidthDesktop) > 0) ? Number(item.stripWidthDesktop) : getViewSize().w;
                const marginBottomDesktop = item.marginBottomDesktop !== undefined ? Number(item.marginBottomDesktop) : 0;
                const maskPercentDesktop = item.maskPercentDesktop !== undefined ? Number(item.maskPercentDesktop) : 22;

                const stripHeight = thumbSize + 16;

                if (isDesktop) {
                    strip.classList.remove('is-mobile');
                    strip.classList.add('is-desktop');
                    
                    strip.style.top = '50%';
                    strip.style.bottom = 'auto';
                    strip.style.left = '50%';
                    strip.style.transform = 'translate(-50%, -50%)';
                    strip.style.width = (item.stripWidthDesktop && Number(item.stripWidthDesktop) > 0) ? `${stripWidthDesktop}px` : '100vw';
                    strip.style.height = `${stripHeight}px`;
                    strip.style.marginBottom = `${marginBottomDesktop}px`;
                    strip.style.marginLeft = '0px';

                    // Dynamic fade mask using maskPercentDesktop recorded in board_data.json
                    const maskCss = `linear-gradient(90deg, 
                        transparent 0%, 
                        rgba(0,0,0,0.4) 3%,
                        #000 ${maskPercentDesktop}%, 
                        #000 calc(50% - 180px), 
                        transparent calc(50% - 135px), 
                        transparent calc(50% + 135px), 
                        #000 calc(50% + 180px), 
                        #000 ${100 - maskPercentDesktop}%, 
                        rgba(0,0,0,0.4) 97%,
                        transparent 100%)`;
                    viewport.style.webkitMaskImage = maskCss;
                    viewport.style.maskImage = maskCss;
                } else {
                    strip.classList.remove('is-desktop');
                    strip.classList.add('is-mobile');

                    strip.style.top = 'auto';
                    strip.style.bottom = '100%';
                    strip.style.left = '50%';
                    strip.style.transform = 'translateX(-50%)';
                    strip.style.width = `${stripWidthMobile}px`;
                    strip.style.height = `${stripHeight}px`;
                    strip.style.marginBottom = `${marginBottomMobile}px`;
                    strip.style.marginLeft = '0px';

                    const maskCss = `linear-gradient(90deg, transparent 0%, #000 ${maskPercentMobile}%, #000 ${100 - maskPercentMobile}%, transparent 100%)`;
                    viewport.style.webkitMaskImage = maskCss;
                    viewport.style.maskImage = maskCss;
                }

                return { isDesktop, thumbSize, stripHeight };
            }

            function render() {
                track.style.transform = `translate3d(${st.pos.toFixed(2)}px, 0, 0)`;
            }

            function createThumbElem(src, size) {
                const el = document.createElement('div');
                el.className = 'thumb-item';
                el.style.width = `${size}px`;
                el.style.height = `${size}px`;
                const img = document.createElement('img');
                img.src = src; img.draggable = false; img.alt = '';
                el.appendChild(img);
                return el;
            }

            function build(images) {
                const { isDesktop, thumbSize } = updateDimensionsAndLayout();
                track.innerHTML = '';
                st.items = images.map(src => {
                    const el = createThumbElem(src, thumbSize);
                    track.appendChild(el);
                    return el;
                });

                const containerWidth = isDesktop 
                    ? ((item.stripWidthDesktop && Number(item.stripWidthDesktop) > 0) ? Number(item.stripWidthDesktop) : getViewSize().w) 
                    : (item.stripWidthMobile || 312);
                const centerScreen = containerWidth / 2;

                const posFor = (i) => centerScreen - (i * (thumbSize + THUMB_GAP) + thumbSize / 2);

                st.max = posFor(0);
                st.min = posFor(images.length - 1);
                
                const defaultIdx = Math.min(2, images.length - 1);
                st.pos = st.target = posFor(defaultIdx);
                render();
            }

            st.rebuildLayout = function() {
                if (st.open && st.anim) { st.anim.cancel(); st.anim = null; }
                updateDimensionsAndLayout();
                if (st.open) {
                    if (st.images) {
                        build(st.images);
                    }
                }
            };

            const rubber = over => 44 * (1 - Math.exp(-over / 110));

            const handlePointerStart = e => {
                if (e.target.closest('.btn-toggle-preview') || e.target.closest('.btn-expand-project')) {
                    return;
                }
                e.stopPropagation();
                if (e.cancelable) e.preventDefault();
                if (e.button !== undefined && e.button !== 0) return;

                stopInertiaAnimation();

                st.dragging = true;
                st.startX = st.lastX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
                st.startPos = st.pos;
                st.lastT = performance.now();
                st.vel = 0;
                strip.classList.add('dragging');

                const onPointerMove = moveEvt => {
                    if (!st.dragging) return;
                    moveEvt.stopPropagation();
                    if (moveEvt.cancelable) moveEvt.preventDefault();

                    const currentX = moveEvt.clientX || (moveEvt.touches && moveEvt.touches[0].clientX) || 0;
                    const raw = st.startPos + (currentX - st.startX);
                    let v = raw;
                    if (raw > st.max) v = st.max + rubber(raw - st.max);
                    else if (raw < st.min) v = st.min - rubber(st.min - raw);
                    st.pos = v;
                    
                    const now = performance.now();
                    const dt = Math.max(1, now - st.lastT);
                    st.vel = 0.6 * st.vel + 0.4 * ((currentX - st.lastX) / dt);
                    st.lastX = currentX;
                    st.lastT = now;
                    render();
                };

                const onPointerUp = upEvt => {
                    if (!st.dragging) return;
                    upEvt.stopPropagation();
                    if (upEvt.cancelable) upEvt.preventDefault();
                    st.dragging = false;
                    strip.classList.remove('dragging');
                    document.removeEventListener('pointermove', onPointerMove);
                    document.removeEventListener('pointerup', onPointerUp);
                    document.removeEventListener('pointercancel', onPointerUp);

                    let lastInertiaTime = performance.now();
                    function inertiaStep() {
                        const now = performance.now();
                        const dt = Math.min(32, now - lastInertiaTime);
                        lastInertiaTime = now;

                        st.pos += st.vel * dt * 0.85;
                        st.vel *= Math.pow(0.88, dt / 16);

                        if (st.pos > st.max) {
                            st.pos += (st.max - st.pos) * 0.18;
                            st.vel *= 0.4;
                        } else if (st.pos < st.min) {
                            st.pos += (st.min - st.pos) * 0.18;
                            st.vel *= 0.4;
                        }

                        render();

                        if (Math.abs(st.vel) > 0.005 || st.pos > st.max + 0.5 || st.pos < st.min - 0.5) {
                            st.animRaf = requestAnimationFrame(inertiaStep);
                        } else {
                            st.pos = Math.max(st.min, Math.min(st.max, st.pos));
                            render();
                            st.animRaf = null;
                        }
                    }

                    if (Math.abs(st.vel) > 0.01 || st.pos > st.max || st.pos < st.min) {
                        st.animRaf = requestAnimationFrame(inertiaStep);
                    }
                };

                document.addEventListener('pointermove', onPointerMove, { passive: false });
                document.addEventListener('pointerup', onPointerUp, { passive: false });
                document.addEventListener('pointercancel', onPointerUp, { passive: false });
            };

            strip.addEventListener('pointerdown', handlePointerStart, { passive: false });
            // 觸控改由 pointer events 統一處理（touch-action:none 已確保手勢不被瀏覽器接管），避免與 touchstart 重複觸發
            strip.addEventListener('touchstart', e => { e.stopPropagation(); }, { passive: true });
            strip.addEventListener('mousedown', e => e.stopPropagation());
            strip.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); });

            function setIcon(open) {
                btn.innerHTML = open ? ICON_COLLAPSE : ICON_EXPAND;
                btn.title = open ? '收縮縮圖' : '展開縮圖';
            }

            st.openStrip = async function() {
                if (st.open) return;
                const isDesktop = isDesktopViewport();
                updateDimensionsAndLayout();

                if (!st.images) {
                    const found = await resolvePreImages(item, yaw, pitch);
                    st.images = found.length ? found : makeDefaultThumbs();
                    build(st.images);
                } else {
                    build(st.images);
                }

                strip.style.display = 'block';
                st.open = true;
                setIcon(true);

                const baseTransform = isDesktop ? 'translate(-50%, -50%)' : 'translateX(-50%)';

                st.anim = strip.animate([
                    { transform: `${baseTransform} scale(0, 0.15)`, opacity: 0 },
                    { transform: `${baseTransform} scale(1.04, 1.02)`, opacity: 1, offset: 0.62 },
                    { transform: `${baseTransform} scale(1, 1)`, opacity: 1 }
                ], { duration: 400, easing: 'cubic-bezier(0.22, 0.8, 0.3, 1)', fill: 'forwards' });

                const openAnim = st.anim;
                await openAnim.finished.catch(() => {});
                // 動畫結束後交還給 inline style，之後轉向重排時 transform 才會生效
                if (st.open && st.anim === openAnim) { openAnim.cancel(); st.anim = null; }
            };

            st.closeStrip = async function() {
                if (!st.open) return;
                stopInertiaAnimation();
                st.open = false;
                setIcon(false);
                const isDesktop = isDesktopViewport();
                const baseTransform = isDesktop ? 'translate(-50%, -50%)' : 'translateX(-50%)';

                st.anim = strip.animate([
                    { transform: `${baseTransform} scale(1, 1)`, opacity: 1 },
                    { transform: `${baseTransform} scale(1.02, 1.02)`, opacity: 1, offset: 0.28 },
                    { transform: `${baseTransform} scale(0, 0.15)`, opacity: 0 }
                ], { duration: 320, easing: 'ease-in-out', fill: 'forwards' });

                await st.anim.finished.catch(() => {});
                if (!st.open) strip.style.display = 'none';
            };

            btn.addEventListener('pointerdown', e => e.stopPropagation());
            btn.addEventListener('mousedown', e => e.stopPropagation());
            btn.addEventListener('touchstart', e => e.stopPropagation());

            btn.addEventListener('click', async e => {
                e.preventDefault();
                e.stopPropagation();
                if (st.busy) return;
                st.busy = true;
                try { 
                    st.open ? await st.closeStrip() : await st.openStrip(); 
                } finally { 
                    st.busy = false; 
                }
            });

            spatialDomNodes[key] = spatialDomNodes[key] || {};
            spatialDomNodes[key].controller = st;
        }

        // 指標是否落在任何「已展開的縮圖列」範圍內（含縫隙與遮罩淡出區）
        function isPointInsideOpenThumbStrip(x, y) {
            const strips = document.querySelectorAll('.thumb-strip');
            for (const s of strips) {
                if (s.style.display === 'none' || getComputedStyle(s).display === 'none') continue;
                const r = s.getBoundingClientRect();
                if (x >= r.left - 4 && x <= r.right + 4 && y >= r.top - 4 && y <= r.bottom + 4) return true;
            }
            return false;
        }

        function onPointerDown(event) {
            // 縮圖區域內一律只做縮圖滑動，不觸發整個 360° 畫面的拖曳
            if (event.target && event.target.closest && event.target.closest('.thumb-strip')) return;
            if (isPointInsideOpenThumbStrip(event.clientX, event.clientY)) return;

            if (event.isPrimary === false) return;

            isUserInteracting = true;
            isSnapping = false;
            pointerMoveDistance = 0;

            onPointerDownPointerX = event.clientX;
            onPointerDownPointerY = event.clientY;

            onPointerDownLon = lon;
            onPointerDownLat = lat;

            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
            document.addEventListener('pointercancel', onPointerUp);
        }

        function onPointerMove(event) {
            if (event.isPrimary === false) return;

            const dx = event.clientX - onPointerDownPointerX;
            const dy = event.clientY - onPointerDownPointerY;
            pointerMoveDistance = Math.sqrt(dx * dx + dy * dy);

            const sensitivity = 0.27;
            lon = (onPointerDownPointerX - event.clientX) * sensitivity + onPointerDownLon;
            lat = (event.clientY - onPointerDownPointerY) * sensitivity + onPointerDownLat;

            lat = Math.max(-85, Math.min(85, lat));
        }

        function onPointerUp(event) {
            if (event.isPrimary === false) return;

            isUserInteracting = false;
            document.removeEventListener('pointermove', onPointerMove);
            document.removeEventListener('pointerup', onPointerUp);
            document.removeEventListener('pointercancel', onPointerUp);

            snapToNearestAngle();
        }

        function getTargetLonForYaw(currentLon, targetYaw) {
            let currentNormalized = ((currentLon % 360) + 360) % 360;
            let diff = targetYaw - currentNormalized;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            return currentLon + diff;
        }

        function getShortestAngleDiff(from, to) {
            let diff = (to - from) % 360;
            if (diff < -180) diff += 360;
            if (diff > 180) diff -= 360;
            return diff;
        }

        function snapToNearestAngle() {
            let normalizedLon = ((lon % 360) + 360) % 360;

            let closestYaw = YAW_TARGETS[0];
            let minYawDiff = Infinity;

            YAW_TARGETS.forEach(target => {
                let diff = Math.abs(getShortestAngleDiff(normalizedLon, target));
                if (diff < minYawDiff) {
                    minYawDiff = diff;
                    closestYaw = target;
                }
            });

            let closestPitch = PITCH_TARGETS[0];
            let minPitchDiff = Infinity;

            PITCH_TARGETS.forEach(target => {
                let diff = Math.abs(lat - target);
                if (diff < minPitchDiff) {
                    minPitchDiff = diff;
                    closestPitch = target;
                }
            });

            targetLon = getTargetLonForYaw(lon, closestYaw);
            targetLat = closestPitch;
            isSnapping = true;

            const key = `${closestYaw}_${closestPitch}`;
            updateActivePanelAndPreviews(key, closestYaw, closestPitch);
        }

        function updateActivePanelAndPreviews(activeKey, yaw, pitch) {
            activePanelKey = activeKey;
            updateButtonHighlights(yaw, pitch);

            Object.keys(spatialDomNodes).forEach(k => {
                const item = spatialDomNodes[k];
                if (item && item.controller) {
                    if (k === activeKey) {
                        if (!item.controller.open) {
                            item.controller.openStrip();
                        }
                    } else {
                        if (item.controller.open) {
                            item.controller.closeStrip();
                        }
                    }
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isSnapping && !isUserInteracting) {
                const lerpFactor = 0.08;
                lon += (targetLon - lon) * lerpFactor;
                lat += (targetLat - lat) * lerpFactor;

                if (Math.abs(targetLon - lon) < 0.1 && Math.abs(targetLat - lat) < 0.1) {
                    lon = targetLon;
                    lat = targetLat;
                    isSnapping = false;
                }
            }

            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);

            const x = 500 * Math.sin(phi) * Math.cos(theta);
            const y = 500 * Math.cos(phi);
            const z = 500 * Math.sin(phi) * Math.sin(theta);

            camera.lookAt(x, y, z);
            renderer.render(scene, camera);

            updateSpatialPanelPositions();
        }

        function updateSpatialPanelPositions() {
            const radius = 400;
            const viewSize = getViewSize();

            Object.keys(spatialDomNodes).forEach(key => {
                const item = spatialDomNodes[key];
                if (!item.card) item.card = item.element.querySelector('.main-card-content');
                const cardEl = item.card || item.element;

                const phi = THREE.MathUtils.degToRad(90 - item.pitch);
                const theta = THREE.MathUtils.degToRad(item.yaw);

                const vec = new THREE.Vector3(
                    radius * Math.sin(phi) * Math.cos(theta),
                    radius * Math.cos(phi),
                    radius * Math.sin(phi) * Math.sin(theta)
                );

                const cameraDir = new THREE.Vector3();
                camera.getWorldDirection(cameraDir);
                const dot = vec.clone().normalize().dot(cameraDir);

                const projectedVec = vec.clone().project(camera);

                if (dot > 0.2 && projectedVec.z < 1) {
                    const screenX = (projectedVec.x * 0.5 + 0.5) * viewSize.w;
                    const screenY = (-(projectedVec.y * 0.5) + 0.5) * viewSize.h;

                    const centerDist = Math.sqrt(
                        Math.pow(projectedVec.x, 2) + Math.pow(projectedVec.y, 2)
                    );
                    
                    const opacity = Math.max(0, 1 - centerDist * 0.8);
                    const scale = (centerDist < 0.2) ? 1.05 : Math.max(0.75, 1 - centerDist * 0.3);

                    item.element.style.transform = `translate3d(${screenX}px, ${screenY}px, 0px) translate(-50%, -50%) scale(${scale.toFixed(3)})`;
                    item.element.style.zIndex = key === activePanelKey ? '5' : '1';
                    cardEl.style.opacity = opacity.toFixed(2);
                    cardEl.style.pointerEvents = opacity > 0.3 ? 'auto' : 'none';
                } else {
                    cardEl.style.opacity = '0';
                    cardEl.style.pointerEvents = 'none';
                }
            });
        }

        function updateButtonHighlights(yaw, pitch) {
            document.querySelectorAll('.btn-nav').forEach(btn => {
                const btnYaw = parseInt(btn.dataset.yaw);
                const btnPitch = parseInt(btn.dataset.pitch);

                if (btnYaw === yaw && btnPitch === pitch) {
                    btn.classList.add('bg-peach-500', 'text-charcoal-950', 'font-bold');
                    btn.classList.remove('text-gray-300');
                } else {
                    btn.classList.remove('bg-peach-500', 'text-charcoal-950', 'font-bold');
                    btn.classList.add('text-gray-300');
                }
            });
        }

        function setupNavigationButtons() {
            const navContainer = document.getElementById('nav-buttons-container');
            if (!navContainer) return;

            // 依 pitch 分組 (由下往上)，同組內依 yaw 排序，組與組之間加分隔線
            const entries = Object.keys(PORTFOLIO_DATA).map(key => {
                const d = PORTFOLIO_DATA[key];
                const [ky, kp] = key.split('_').map(Number);
                const y = d.yaw !== undefined ? Number(d.yaw) : ky;
                const p = d.pitch !== undefined ? Number(d.pitch) : kp;
                return { key, d, y, p };
            }).sort((a, b) => (a.p - b.p) || (a.y - b.y));

            navContainer.innerHTML = '';
            let lastPitch = null;
            entries.forEach(({ key, d, y, p }) => {
                if (lastPitch !== null && p !== lastPitch) {
                    const divider = document.createElement('div');
                    divider.className = 'h-4 w-[1px] bg-white/10 mx-1 hidden sm:block';
                    navContainer.appendChild(divider);
                }
                lastPitch = p;

                const btn = document.createElement('button');
                btn.dataset.yaw = y;
                btn.dataset.pitch = p;
                btn.className = 'btn-nav text-xs px-3 py-1.5 rounded-xl font-medium transition text-gray-300 hover:text-white hover:bg-white/10 flex items-center gap-1';
                btn.textContent = d.category || d.title || key;

                btn.addEventListener('click', () => {
                    targetLon = getTargetLonForYaw(lon, y);
                    targetLat = p;
                    isSnapping = true;
                    updateActivePanelAndPreviews(key, y, p);
                });
                navContainer.appendChild(btn);
            });
        }

        let isUiVisible = true;
        function setupUIToggleButton() {
            const toggleBtn = document.getElementById('toggle-ui-btn');
            const toggleText = document.getElementById('toggle-ui-text');
            const hudFooter = document.getElementById('hud-footer');
            const spatialPanelsContainer = document.getElementById('spatial-panels-container');

            if (toggleBtn && hudFooter && spatialPanelsContainer) {
                toggleBtn.addEventListener('click', () => {
                    isUiVisible = !isUiVisible;
                    if (isUiVisible) {
                        hudFooter.classList.remove('opacity-0', 'pointer-events-none');
                        spatialPanelsContainer.classList.remove('opacity-0');
                        toggleText.innerText = '隱藏 UI 介面';
                    } else {
                        hudFooter.classList.add('opacity-0', 'pointer-events-none');
                        spatialPanelsContainer.classList.add('opacity-0');
                        toggleText.innerText = '顯示 UI 介面';
                    }
                });
            }
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            const { w, h } = getViewSize();
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h, false);

            Object.keys(spatialDomNodes).forEach(k => {
                const item = spatialDomNodes[k];
                if (item && item.controller) {
                    if (item.controller.rebuildLayout) {
                        item.controller.rebuildLayout();
                    } else if (item.controller.open) {
                        item.controller.openStrip();
                    }
                }
            });
        }

        async function openProjectDetailModal(key) {
            const data = PORTFOLIO_DATA[key];
            if (!data) return;

            const modalContentEl = document.getElementById('modal-detail-content');
            window.__currentPanelFolder = data.folder;      // 讓 content.html 知道要讀哪個資料夾的 portfolio_data.json
            document.documentElement.classList.add('modal-open');
            setAppHeight();
            
            modalContentEl.innerHTML = `
                <div class="flex items-center justify-center h-full text-peach-400 gap-3">
                    <span class="text-sm font-semibold">正在載入專案大圖展演...</span>
                </div>
            `;

            const modalDetails = document.getElementById('modal-details');
            if (modalDetails) {
                modalDetails.classList.remove('opacity-0', 'pointer-events-none', 'hidden');
            }

            const hudOverlay = document.getElementById('ui-hud-overlay');
            const spatialPanels = document.getElementById('spatial-panels-container');
            if (hudOverlay) hudOverlay.classList.add('opacity-0');
            if (spatialPanels) spatialPanels.classList.add('opacity-0');

            const existingDynamicScripts = document.querySelectorAll('.dynamic-modal-script');
            existingDynamicScripts.forEach(s => s.remove());

            let loadedCustom = false;

            // 不再只依賴 hasCustomHtml：只要資料夾內有 content.html 就載入，找不到 (404) 才用下方預設版面
            {
                const customHtmlPath = data.detailFilePath || `${data.folder}content.html`;
                try {
                    const response = await fetch(customHtmlPath);
                    if (response.ok) {
                        const htmlText = await response.text();
                        if (htmlText && htmlText.trim().length > 0) {
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(htmlText, 'text/html');
                            
                            modalContentEl.innerHTML = doc.body ? doc.body.innerHTML : htmlText;

                            const scripts = doc.querySelectorAll('script');
                            scripts.forEach(oldScript => {
                                const newScript = document.createElement('script');
                                newScript.className = 'dynamic-modal-script';
                                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                                document.body.appendChild(newScript);
                            });

                            loadedCustom = true;
                        }
                    }
                } catch (err) {
                    console.error(`[Fetch 異常] 讀取 ${customHtmlPath} 時發生錯誤:`, err);
                }
            }

            if (!loadedCustom) {
                modalContentEl.innerHTML = `
                    <div class="flex items-center justify-between pb-4 mb-4 border-b border-white/10">
                        <div>
                            <span class="px-2.5 py-0.5 bg-peach-500/20 text-peach-300 text-xs font-semibold rounded-md border border-peach-500/30">
                                ${escapeHTML(data.category)}
                            </span>
                            <h3 class="text-xl font-bold text-white mt-2">${escapeHTML(data.title)}</h3>
                        </div>
                        <button onclick="window.closeModalFallback()" class="w-8 h-8 rounded-xl glass-panel flex items-center justify-center text-xs text-gray-300 hover:text-white hover:bg-rose-500/20 hover:border-rose-400/50 transition border border-white/10 shadow-md">
                            ✕
                        </button>
                    </div>

                    <p class="text-sm text-gray-200 leading-relaxed mb-6">${escapeHTML(data.desc)}</p>
                    
                    <h4 class="text-sm font-bold text-white pt-2 border-t border-white/10 flex items-center gap-2 mb-4">
                        作品展示媒體庫：
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${(data.images || []).map(img => `
                            <div class="rounded-2xl overflow-hidden border border-white/10 bg-charcoal-900 group relative">
                                <img src="${img}" class="w-full h-48 object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://placehold.co/600x400/1c1c1f/fcd191?text=Portfolio+Asset'">
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        window.closeModalFallback = function() {
            const modalDetails = document.getElementById('modal-details');
            if (modalDetails) modalDetails.classList.add('opacity-0', 'pointer-events-none', 'hidden');
            document.documentElement.classList.remove('modal-open');

            const hudOverlay = document.getElementById('ui-hud-overlay');
            const spatialPanels = document.getElementById('spatial-panels-container');
            if (hudOverlay) {
                hudOverlay.classList.remove('opacity-0');
            }
            if (spatialPanels) {
                spatialPanels.classList.remove('opacity-0');
            }
        };

        const toggleNavBtn = document.getElementById('toggle-nav-btn');
        const navContentWrapper = document.getElementById('nav-content-wrapper');
        const toggleNavIcon = document.getElementById('toggle-nav-icon');
        let isNavExpanded = true;

        if (toggleNavBtn && navContentWrapper && toggleNavIcon) {
            toggleNavBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                isNavExpanded = !isNavExpanded;
                if (isNavExpanded) {
                    navContentWrapper.classList.remove('max-h-0', 'opacity-0', 'pointer-events-none');
                    navContentWrapper.classList.add('max-h-[350px]', 'opacity-100');
                    toggleNavIcon.innerText = '▼';
                } else {
                    navContentWrapper.classList.remove('max-h-[350px]', 'opacity-100');
                    navContentWrapper.classList.add('max-h-0', 'opacity-0', 'pointer-events-none');
                    toggleNavIcon.innerText = '▲';
                }
            });
        }

        window.onload = function() {
            init();
        };
    </script>
</body>
</html>
