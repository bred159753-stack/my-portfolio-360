<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360° Spatial Portfolio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        peach: {
                            300: '#fde5be',
                            400: '#fcd8a0',
                            500: '#fcd191',
                            600: '#e0b879',
                        },
                        charcoal: {
                            800: '#2c2c31',
                            850: '#232327',
                            900: '#1c1c1f',
                            950: '#141416',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            background-color: #141416;
            color: #f3f4f6;
            touch-action: none;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            cursor: grab;
            touch-action: none;
        }
        #webgl-container:active {
            cursor: grabbing;
        }
        .glass-panel {
            background: linear-gradient(180deg, rgba(35, 35, 39, 0.90) 0%, rgba(35, 35, 39, 0.60) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* 漸層霧面半透明面板（上80% -> 下40%） */
        .glass-card {
            background: linear-gradient(180deg, rgba(35, 35, 39, 0.80) 0%, rgba(35, 35, 39, 0.40) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(252, 209, 145, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .spatial-node {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: auto;
            will-change: transform, opacity;
            transition: border-color 0.2s ease, background-color 0.2s ease, opacity 0.15s ease;
            touch-action: none;
        }
    </style>
</head>
<body class="h-full font-sans antialiased overflow-hidden">

    <!-- Modal Detail Container -->

        <div class="glass-panel w-full max-w-5xl rounded-3xl p-4 sm:p-6 max-h-[92vh] flex flex-col border border-white/20 shadow-2xl relative overflow-hidden">

    <script>
        const PORTFOLIO_DATA = {

            },
            "0_0": {

                desc: "展示品牌核心視覺與標誌設計案例。融合現代幾何學與沉浸式視覺體驗。",

            },

                images: [

                ]
            },
            "270_0": {

                category: "生成藝術",
                desc: "Shader 演算法動畫、Generative Art 與聲音感應互動專案。",
                folder: "assets/angle_270_0/",
                hasCustomHtml: false,
                images: [
                    "https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?auto=format&fit=crop&w=600&q=80"
                ]
            },
            "0_30": {
                title: "UI / UX 介面設計系統",
                category: "UI/UX 介面",
                desc: "專注於跨平台 Dashboard 介面與 Component Design System 規範。",
                folder: "assets/angle_0_30/",
                hasCustomHtml: false,
                images: [
                    "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=600&q=80"
                ]
            },
            "90_30": {
                title: "跨平台 App 開發專案",
                category: "App 開發",
                desc: "Flutter 與 React Native 跨平台應用程式設計與體驗調優。",
                folder: "assets/angle_90_30/",
                hasCustomHtml: false,
                images: [
                    "https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?auto=format&fit=crop&w=600&q=80"
                ]
            },
            "180_30": {
                title: "動態視覺與特效展示",
                category: "動態視覺",
                desc: "AE 影音後製、粒子特效與 UI 動態微互動設計。",
                folder: "assets/angle_180_30/",
                hasCustomHtml: false,
                images: [
                    "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=600&q=80"
                ]
            },
            "270_30": {
                title: "音效與聲音互動實驗",
                category: "音效互動",
                desc: "Web Audio API 聲波視覺化與聲音微程式控制。",
                folder: "assets/angle_270_30/",
                hasCustomHtml: false,
                images: [
                    "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=600&q=80"
                ]
            },
            "0_60": {
                title: "高階架構 & 全端技術棧",
                category: "全端架構",
                desc: "包含前後端分離系統、Three.js 演算效能調優與 API 串接。",
                folder: "assets/angle_0_60/",
                hasCustomHtml: false,
                images: [
                    "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=600&q=80"
                ]
            }
        };

        const YAW_TARGETS = [0, 90, 180, 270];
        const PITCH_TARGETS = [-60, -30, 0, 30, 60];

        let container, scene, camera, renderer, sphereMesh;
        let isUserInteracting = false;
        let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
        let onPointerDownLon = 0, onPointerDownLat = 0;
        let pointerMoveDistance = 0;

        let lon = 0, lat = 0;
        let targetLon = 0, targetLat = 0;
        let isSnapping = false;

        const spatialDomNodes = {};

        function init() {
            container = document.getElementById('webgl-container');
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);
            scene = new THREE.Scene();

            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);

            const defaultTexture = new THREE.CanvasTexture(generateDefaultPanoCanvas());
            const material = new THREE.MeshBasicMaterial({ map: defaultTexture });

            sphereMesh = new THREE.Mesh(geometry, material);
            scene.add(sphereMesh);

            const textureLoader = new THREE.TextureLoader();
            textureLoader.load(
                'assets/pano_bg.jpg',
                function (loadedTexture) {
                    material.map = loadedTexture;
                    material.needsUpdate = true;
                },
                undefined,
                function () {
                    console.log('未讀取到 assets/pano_bg.jpg，使用預設網格背景。');
                }
            );

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            createSpatialPanelElements();

            container.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('resize', onWindowResize);

            setupNavigationButtons();
            setupUIToggleButton();
            snapToNearestAngle();
            animate();
        }

        function generateDefaultPanoCanvas() {
            const canvas = document.createElement('canvas');
            canvas.width = 4096;
            canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#141416');
            grad.addColorStop(0.5, '#232327');
            grad.addColorStop(1, '#141416');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < 360; i += 15) {
                const x = (i / 360) * canvas.width;
                ctx.beginPath();
                if (i % 90 === 0) {
                    ctx.strokeStyle = 'rgba(252, 209, 145, 0.35)';
                    ctx.lineWidth = 6;
                } else {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                    ctx.lineWidth = 2;
                }
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            const pitchAngles = [-60, -30, 0, 30, 60];
            pitchAngles.forEach(p => {
                const y = ((90 - p) / 180) * canvas.height;
                ctx.beginPath();
                ctx.strokeStyle = p === 0 ? 'rgba(252, 209, 145, 0.45)' : 'rgba(255, 255, 255, 0.06)';
                ctx.lineWidth = p === 0 ? 5 : 2;
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            });

            return canvas;
        }

        function createSpatialPanelElements() {
            const containerOverlay = document.getElementById('spatial-panels-container');

            Object.keys(PORTFOLIO_DATA).forEach(key => {
                const item = PORTFOLIO_DATA[key];
                const [yaw, pitch] = key.split('_').map(Number);

                const node = document.createElement('div');
                node.className = 'spatial-node glass-card p-4 rounded-2xl w-64 text-left border border-peach-500/30 hover:border-peach-500 cursor-pointer shadow-2xl';
                node.dataset.key = key;

                updateNodeCardHTML(node, item);

                node.addEventListener('pointerdown', (e) => {
                    if (e.target.closest('.btn-expand-project')) {
                        e.stopPropagation();
                        return;
                    }
                    onPointerDown(e);
                });

                const expandBtn = node.querySelector('.btn-expand-project');
                if (expandBtn) {
                    expandBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        openProjectDetailModal(key);
                    });
                }

                node.addEventListener('click', (e) => {
                    if (pointerMoveDistance > 8) return;
                    if (e.target.closest('.btn-expand-project')) return;

                    targetLon = Math.floor(lon / 360) * 360 + yaw;
                    targetLat = pitch;
                    isSnapping = true;
                    updateButtonHighlights(yaw, pitch);
                });

                containerOverlay.appendChild(node);
                spatialDomNodes[key] = {
                    element: node,
                    yaw: yaw,
                    pitch: pitch
                };
            });
        }

        function updateNodeCardHTML(node, item) {
            node.innerHTML = `
                <p class="text-gray-200 text-xs line-clamp-3 mb-3 leading-relaxed pt-1">
                    ${item.desc}
                </p>
                <div class="pt-2 border-t border-white/10 text-xs font-semibold">
                    <button class="btn-expand-project w-full bg-peach-500 hover:bg-peach-400 text-charcoal-950 py-1.5 px-3 rounded-xl transition flex items-center justify-center gap-1.5 shadow-lg shadow-peach-500/20 font-bold">
                        展開作品
                    </button>
                </div>
            `;
        }

        function onPointerDown(event) {
            if (event.isPrimary === false) return;

            isUserInteracting = true;
            isSnapping = false;
            pointerMoveDistance = 0;

            onPointerDownPointerX = event.clientX;
            onPointerDownPointerY = event.clientY;

            onPointerDownLon = lon;
            onPointerDownLat = lat;

            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
            document.addEventListener('pointercancel', onPointerUp);
        }

        function onPointerMove(event) {
            if (event.isPrimary === false) return;

            const dx = event.clientX - onPointerDownPointerX;
            const dy = event.clientY - onPointerDownPointerY;
            pointerMoveDistance = Math.sqrt(dx * dx + dy * dy);

            const sensitivity = 0.27;
            lon = (onPointerDownPointerX - event.clientX) * sensitivity + onPointerDownLon;
            lat = (event.clientY - onPointerDownPointerY) * sensitivity + onPointerDownLat;

            lat = Math.max(-85, Math.min(85, lat));
        }

        function onPointerUp(event) {
            if (event.isPrimary === false) return;

            isUserInteracting = false;
            document.removeEventListener('pointermove', onPointerMove);
            document.removeEventListener('pointerup', onPointerUp);
            document.removeEventListener('pointercancel', onPointerUp);

            snapToNearestAngle();
        }

        function snapToNearestAngle() {
            let normalizedLon = ((lon % 360) + 360) % 360;

            let closestYaw = YAW_TARGETS[0];
            let minYawDiff = Infinity;

            YAW_TARGETS.forEach(target => {
                let diff = Math.abs(getShortestAngleDiff(normalizedLon, target));
                if (diff < minYawDiff) {
                    minYawDiff = diff;
                    closestYaw = target;
                }
            });

            let closestPitch = PITCH_TARGETS[0];
            let minPitchDiff = Infinity;

            PITCH_TARGETS.forEach(target => {
                let diff = Math.abs(lat - target);
                if (diff < minPitchDiff) {
                    minPitchDiff = diff;
                    closestPitch = target;
                }
            });

            const currentCircle = Math.floor(lon / 360);
            let candidate1 = currentCircle * 360 + closestYaw;
            let candidate2 = (currentCircle + 1) * 360 + closestYaw;
            let candidate3 = (currentCircle - 1) * 360 + closestYaw;

            let candidates = [candidate1, candidate2, candidate3];
            candidates.sort((a, b) => Math.abs(a - lon) - Math.abs(b - lon));

            targetLon = candidates[0];
            targetLat = closestPitch;
            isSnapping = true;

            updateButtonHighlights(closestYaw, closestPitch);
        }

        function getShortestAngleDiff(from, to) {
            let diff = (to - from) % 360;
            if (diff < -180) diff += 360;
            if (diff > 180) diff -= 360;
            return diff;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isSnapping && !isUserInteracting) {
                const lerpFactor = 0.08;
                lon += (targetLon - lon) * lerpFactor;
                lat += (targetLat - lat) * lerpFactor;

                if (Math.abs(targetLon - lon) < 0.1 && Math.abs(targetLat - lat) < 0.1) {
                    lon = targetLon;
                    lat = targetLat;
                    isSnapping = false;
                }
            }

            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);

            const x = 500 * Math.sin(phi) * Math.cos(theta);
            const y = 500 * Math.cos(phi);
            const z = 500 * Math.sin(phi) * Math.sin(theta);

            camera.lookAt(x, y, z);
            renderer.render(scene, camera);

            updateSpatialPanelPositions();
        }

        function updateSpatialPanelPositions() {
            const radius = 400;

            Object.keys(spatialDomNodes).forEach(key => {
                const item = spatialDomNodes[key];

                const phi = THREE.MathUtils.degToRad(90 - item.pitch);
                const theta = THREE.MathUtils.degToRad(item.yaw);

                const vec = new THREE.Vector3(
                    radius * Math.sin(phi) * Math.cos(theta),
                    radius * Math.cos(phi),
                    radius * Math.sin(phi) * Math.sin(theta)
                );

                const cameraDir = new THREE.Vector3();
                camera.getWorldDirection(cameraDir);
                const dot = vec.clone().normalize().dot(cameraDir);

                const projectedVec = vec.clone().project(camera);

                if (dot > 0.2 && projectedVec.z < 1) {
                    const screenX = (projectedVec.x * 0.5 + 0.5) * window.innerWidth;
                    const screenY = (-(projectedVec.y * 0.5) + 0.5) * window.innerHeight;

                    const centerDist = Math.sqrt(
                        Math.pow(projectedVec.x, 2) + Math.pow(projectedVec.y, 2)
                    );
                    
                    const opacity = Math.max(0, 1 - centerDist * 0.8);
                    const scale = (centerDist < 0.2) ? 1.05 : Math.max(0.75, 1 - centerDist * 0.3);

                    item.element.style.transform = `translate3d(${screenX}px, ${screenY}px, 0px) translate(-50%, -50%) scale(${scale.toFixed(3)})`;
                    item.element.style.opacity = opacity.toFixed(2);
                    item.element.style.pointerEvents = opacity > 0.3 ? 'auto' : 'none';
                } else {
                    item.element.style.opacity = '0';
                    item.element.style.pointerEvents = 'none';
                }
            });
        }

        function updateButtonHighlights(yaw, pitch) {
            document.querySelectorAll('.btn-nav').forEach(btn => {
                const btnYaw = parseInt(btn.dataset.yaw);
                const btnPitch = parseInt(btn.dataset.pitch);

                if (btnYaw === yaw && btnPitch === pitch) {
                    btn.classList.add('bg-peach-500', 'text-charcoal-950', 'font-bold');
                    btn.classList.remove('text-gray-300');
                } else {
                    btn.classList.remove('bg-peach-500', 'text-charcoal-950', 'font-bold');
                    btn.classList.add('text-gray-300');
                }
            });
        }

        function setupNavigationButtons() {
            document.querySelectorAll('.btn-nav').forEach(btn => {
                btn.addEventListener('click', () => {
                    const y = parseInt(btn.dataset.yaw);
                    const p = parseInt(btn.dataset.pitch);

                    targetLon = Math.floor(lon / 360) * 360 + y;
                    targetLat = p;
                    isSnapping = true;
                    updateButtonHighlights(y, p);
                });
            });
        }

        let isUiVisible = true;
        function setupUIToggleButton() {
            const toggleBtn = document.getElementById('toggle-ui-btn');
            const toggleText = document.getElementById('toggle-ui-text');
            const hudFooter = document.getElementById('hud-footer');
            const spatialPanelsContainer = document.getElementById('spatial-panels-container');

            if (toggleBtn && hudFooter && spatialPanelsContainer) {
                toggleBtn.addEventListener('click', () => {
                    isUiVisible = !isUiVisible;
                    if (isUiVisible) {
                        hudFooter.classList.remove('opacity-0', 'pointer-events-none');
                        spatialPanelsContainer.classList.remove('opacity-0');
                        toggleText.innerText = '隱藏 UI 介面';
                    } else {
                        hudFooter.classList.add('opacity-0', 'pointer-events-none');
                        spatialPanelsContainer.classList.add('opacity-0');
                        toggleText.innerText = '顯示 UI 介面';
                    }
                });
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        async function openProjectDetailModal(key) {
            const data = PORTFOLIO_DATA[key];
            if (!data) return;

            const modalContentEl = document.getElementById('modal-detail-content');
            
            modalContentEl.innerHTML = `
                <div class="flex items-center justify-center py-16 text-peach-400 gap-3">
                    <span class="text-sm font-semibold">正在讀取專案內容...</span>
                </div>
            `;

            const modalDetails = document.getElementById('modal-details');
            if (modalDetails) {
                modalDetails.classList.remove('opacity-0', 'pointer-events-none');
            }

            // 自動隱藏所有 UI 介面，讓使用者透過霧面透明區塊看到全景底圖
            const hudOverlay = document.getElementById('ui-hud-overlay');
            const spatialPanels = document.getElementById('spatial-panels-container');
            if (hudOverlay) hudOverlay.classList.add('opacity-0');
            if (spatialPanels) spatialPanels.classList.add('opacity-0');

            const existingDynamicScripts = document.querySelectorAll('.dynamic-modal-script');
            existingDynamicScripts.forEach(s => s.remove());

            let loadedCustom = false;

            if (data.hasCustomHtml) {
                const customHtmlPath = `${data.folder}content.html`;
                try {
                    const response = await fetch(customHtmlPath);
                    if (response.ok) {
                        const htmlText = await response.text();
                        if (htmlText && htmlText.trim().length > 0) {
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(htmlText, 'text/html');
                            
                            modalContentEl.innerHTML = doc.body ? doc.body.innerHTML : htmlText;

                            const scripts = doc.querySelectorAll('script');
                            scripts.forEach(oldScript => {
                                const newScript = document.createElement('script');
                                newScript.className = 'dynamic-modal-script';
                                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                                document.body.appendChild(newScript);
                            });

                            loadedCustom = true;
                        }
                    }
                } catch (err) {
                    console.error(`[Fetch 異常] 讀取 ${customHtmlPath} 時發生錯誤:`, err);
                }
            }

            if (!loadedCustom) {
                modalContentEl.innerHTML = `
                    <div class="flex items-center justify-between pb-4 mb-4 border-b border-white/10">
                        <div>
                            <span class="px-2.5 py-0.5 bg-peach-500/20 text-peach-300 text-xs font-semibold rounded-md border border-peach-500/30">
                                ${data.category}
                            </span>
                            <h3 class="text-xl font-bold text-white mt-2">${data.title}</h3>
                        </div>
                        <button onclick="window.closeModalFallback()" class="w-8 h-8 rounded-xl glass-panel flex items-center justify-center text-xs text-gray-300 hover:text-white hover:bg-rose-500/20 hover:border-rose-400/50 transition border border-white/10 shadow-md">
                            ✕
                        </button>
                    </div>

                    <p class="text-sm text-gray-200 leading-relaxed mb-6">${data.desc}</p>
                    
                    <h4 class="text-sm font-bold text-white pt-2 border-t border-white/10 flex items-center gap-2 mb-4">
                        作品展示媒體庫：
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${data.images.map(img => `
                            <div class="rounded-2xl overflow-hidden border border-white/10 bg-charcoal-900 group relative">
                                <img src="${img}" class="w-full h-48 object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://placehold.co/600x400/1c1c1f/fcd191?text=Portfolio+Asset'">
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        window.closeModalFallback = function() {
            const modalDetails = document.getElementById('modal-details');
            if (modalDetails) modalDetails.classList.add('opacity-0', 'pointer-events-none');

            // 關閉專案面板時恢復顯示 360 UI 介面（保持根容器 pointer-events-none 以防阻擋 360 畫布拖曳）
            const hudOverlay = document.getElementById('ui-hud-overlay');
            const spatialPanels = document.getElementById('spatial-panels-container');
            if (hudOverlay) {
                hudOverlay.classList.remove('opacity-0');
                hudOverlay.classList.add('pointer-events-none');
            }
            if (spatialPanels) {
                spatialPanels.classList.remove('opacity-0');
                spatialPanels.classList.add('pointer-events-none');
            }
        };

        const toggleNavBtn = document.getElementById('toggle-nav-btn');
        const navContentWrapper = document.getElementById('nav-content-wrapper');
        const toggleNavIcon = document.getElementById('toggle-nav-icon');
        let isNavExpanded = true;

        if (toggleNavBtn && navContentWrapper && toggleNavIcon) {
            toggleNavBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                isNavExpanded = !isNavExpanded;
                if (isNavExpanded) {
                    navContentWrapper.classList.remove('max-h-0', 'opacity-0', 'pointer-events-none');
                    navContentWrapper.classList.add('max-h-[350px]', 'opacity-100');
                    toggleNavIcon.innerText = '▼';
                } else {
                    navContentWrapper.classList.remove('max-h-[350px]', 'opacity-100');
                    navContentWrapper.classList.add('max-h-0', 'opacity-0', 'pointer-events-none');
                    toggleNavIcon.innerText = '▲';
                }
            });
        }

        window.onload = function() {
            init();
        };
    </script>
</body>
</html>
