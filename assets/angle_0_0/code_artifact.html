<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集全功能管理工具</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        peach: {
                            300: '#fde5be',
                            400: '#fcd8a0',
                            500: '#fcd191',
                            600: '#e0b879',
                        },
                        charcoal: {
                            800: '#2c2c31',
                            850: '#232327',
                            900: '#1c1c1f',
                            950: '#141416',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #141416;
            color: #f3f4f6;
        }
        .glass-panel {
            background: rgba(35, 35, 39, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .dragging {
            opacity: 0.4;
            transform: scale(0.95);
            border-color: #fcd191 !important;
        }
        .tab-dragging, .sub-tab-dragging {
            opacity: 0.4;
            border-style: dashed;
            border-color: #fcd191 !important;
        }
        .image-card.selected-card {
            border-color: #fcd191 !important;
            box-shadow: 0 0 15px rgba(252, 209, 145, 0.3);
        }
        .interactive-img-container {
            overflow: hidden;
            position: relative;
            touch-action: none;
        }
        .interactive-img {
            transition: transform 0.05s ease-out;
            transform-origin: center center;
            will-change: transform;
        }
    </style>
</head>
<body class="min-h-screen bg-charcoal-950 p-3 md:p-6 text-gray-100 flex flex-col">

    <!-- Toast 提示訊息 -->
    <div id="toast" class="fixed top-5 right-5 z-50 bg-peach-500 text-charcoal-950 px-4 py-2.5 rounded-xl font-bold text-xs shadow-2xl transition-all duration-300 opacity-0 pointer-events-none -translate-y-2">
        <span id="toast-message">操作成功！</span>
    </div>

    <!-- 隱藏的本地 JSON 檔案讀取 Input -->
    <input type="file" id="json-file-input" accept=".json" onchange="handleJsonFileImport(event)" class="hidden">

    <!-- 自訂刪除/確認通用 Modal (不使用原生 confirm) -->
    <div id="confirm-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none hidden transition-all duration-200">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 border border-white/20 shadow-2xl space-y-4 text-center">
            <h3 id="confirm-modal-title" class="text-sm font-bold text-white">確認刪除</h3>
            <p id="confirm-modal-msg" class="text-xs text-gray-300">您確定要刪除這項內容嗎？此操作無法復原。</p>
            <div class="flex justify-center gap-3 pt-2">
                <button onclick="closeConfirmModal(false)" class="px-4 py-2 bg-charcoal-900 hover:bg-white/10 text-xs rounded-xl text-gray-300">取消</button>
                <button id="confirm-modal-action-btn" onclick="executeConfirmAction()" class="px-4 py-2 bg-rose-500 hover:bg-rose-400 text-white font-bold text-xs rounded-xl shadow-lg shadow-rose-500/20">確定刪除</button>
            </div>
        </div>
    </div>

    <!-- 主題彈窗 Modal -->
    <div id="theme-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none hidden transition-all duration-200">
        <div class="glass-panel w-full max-w-lg rounded-3xl p-6 border border-white/20 shadow-2xl relative space-y-4">
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <h3 id="theme-modal-title" class="text-sm font-bold text-white">新增主題 (大類別)</h3>
                <button onclick="closeThemeModal()" class="text-xs text-gray-400 hover:text-white">✕</button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-gray-400 mb-1">主題唯一識別 Key (無法編輯，依拖曳順序自動編號)</label>
                    <input type="text" id="modal-theme-key" readonly class="w-full bg-charcoal-950 border border-white/10 rounded-xl px-3 py-2 text-peach-400 font-mono focus:outline-none cursor-not-allowed opacity-80" placeholder="01">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">主題名稱 (中文標題)</label>
                    <input type="text" id="modal-theme-title" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white focus:border-peach-500 focus:outline-none" placeholder="e.g. 厚塗插畫">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">英文字標 (Tag Badge)</label>
                    <input type="text" id="modal-theme-tag" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white focus:border-peach-500 focus:outline-none" placeholder="e.g. Digital Painting">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">主題副標 / 描述文字</label>
                    <input type="text" id="modal-theme-desc" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white focus:border-peach-500 focus:outline-none" placeholder="e.g. 光影筆觸堆疊與厚塗創作">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">卡片背景封面路徑 (bgImage)</label>
                    <input type="text" id="modal-theme-bg" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white font-mono focus:border-peach-500 focus:outline-none" placeholder="assets/angle_0_0/01.jpg">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">對應資料夾路徑 (Folder Path)</label>
                    <input type="text" id="modal-theme-folder" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white font-mono focus:border-peach-500 focus:outline-none" placeholder="assets/angle_0_0/01/">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-white/10">
                <button onclick="closeThemeModal()" class="px-4 py-2 bg-charcoal-900 hover:bg-white/10 text-xs rounded-xl text-gray-300">取消</button>
                <button onclick="saveThemeModal()" class="px-4 py-2 bg-peach-500 hover:bg-peach-400 text-charcoal-950 font-bold text-xs rounded-xl shadow-lg shadow-peach-500/20">儲存主題</button>
            </div>
        </div>
    </div>

    <!-- 小類別彈窗 Modal -->
    <div id="subcategory-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none hidden transition-all duration-200">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 border border-white/20 shadow-2xl relative space-y-4">
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <h3 id="subcategory-modal-title" class="text-sm font-bold text-white">小類別設定</h3>
                <button onclick="closeSubcategoryModal()" class="text-xs text-gray-400 hover:text-white">✕</button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-gray-400 mb-1">小類別名稱 (例如：角色光影研究)</label>
                    <input type="text" id="modal-sub-name" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-white focus:border-peach-500 focus:outline-none" placeholder="e.g. 角色光影研究">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">子資料夾 Folder 前綴 (可填 `A/`、`B/`，或留空直接放於主題根目錄)</label>
                    <input type="text" id="modal-sub-folder" class="w-full bg-charcoal-900 border border-white/10 rounded-xl px-3 py-2 text-peach-300 font-mono focus:border-peach-500 focus:outline-none" placeholder="A/ 或留空">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-white/10">
                <button onclick="closeSubcategoryModal()" class="px-4 py-2 bg-charcoal-900 hover:bg-white/10 text-xs rounded-xl text-gray-300">取消</button>
                <button onclick="saveSubcategoryModal()" class="px-4 py-2 bg-peach-500 hover:bg-peach-400 text-charcoal-950 font-bold text-xs rounded-xl shadow-lg shadow-peach-500/20">儲存小類別</button>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto w-full flex-1 flex flex-col gap-5">
        
        <!-- Header -->
        <header class="glass-panel p-4 md:p-5 rounded-3xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center gap-2">
                    <span class="px-2.5 py-0.5 bg-peach-500/20 text-peach-400 border border-peach-500/30 rounded-md text-[11px] font-bold tracking-wider uppercase">Full Suite Studio</span>
                    <h1 class="text-lg md:text-xl font-extrabold text-white">作品集全功能管理工具</h1>
                </div>
                <p class="text-xs text-gray-400 mt-1">按住卡片直接拖曳排序 | 點擊卡片選定後：<kbd class="px-1.5 py-0.5 bg-white/10 rounded text-peach-300 font-mono">Ctrl + 滾輪</kbd> 縮放圖片，<kbd class="px-1.5 py-0.5 bg-white/10 rounded text-peach-300 font-mono">Ctrl + 左鍵</kbd> 拖曳檢視細節！</p>
            </div>
            
            <div class="flex items-center gap-2 w-full md:w-auto justify-end flex-wrap">
                <button onclick="fetchLocalPortfolioJson()" class="bg-charcoal-900 hover:bg-white/10 border border-white/10 text-peach-300 font-semibold px-3.5 py-2 rounded-xl text-xs transition flex items-center gap-1.5">
                    📥 載入 portfolio_data.json
                </button>
                <button onclick="triggerJsonImport()" class="bg-charcoal-900 hover:bg-white/10 border border-white/10 text-gray-200 font-semibold px-3.5 py-2 rounded-xl text-xs transition flex items-center gap-1.5">
                    📂 選擇 JSON 檔案
                </button>
                <button onclick="downloadJsonData()" class="bg-peach-500 hover:bg-peach-400 active:scale-95 text-charcoal-950 font-bold px-4 py-2 rounded-xl text-xs transition flex items-center gap-1.5 shadow-lg shadow-peach-500/20">
                    📄 下載 portfolio_data.json
                </button>
            </div>
        </header>

        <!-- 主題導航頁籤區 -->
        <div class="glass-panel p-3 rounded-2xl flex items-center justify-between gap-3 overflow-x-auto no-scrollbar">
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar flex-1 py-1" id="theme-tabs-container">
                <!-- 動態注入主題頁籤 -->
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
                <button onclick="openThemeModal(false)" class="bg-peach-500/20 hover:bg-peach-500/30 text-peach-300 border border-peach-500/40 text-xs px-3 py-1.5 rounded-xl font-bold transition flex items-center gap-1">
                    ➕ 新增主題
                </button>
                <button onclick="openThemeModal(true)" class="bg-charcoal-900 hover:bg-white/10 text-xs px-3 py-1.5 rounded-xl border border-white/10 transition text-gray-300">
                    ✏️ 編輯主題
                </button>
                <button onclick="requestDeleteCurrentTheme()" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 text-xs px-2.5 py-1.5 rounded-xl transition font-bold">
                    🗑️ 刪除主題
                </button>
            </div>
        </div>

        <!-- 小類別與作品網格區 -->
        <div class="flex flex-col gap-4 flex-1">
            
            <div class="glass-panel p-3.5 rounded-2xl flex flex-col gap-3">
                <div class="flex items-center justify-between flex-wrap gap-2">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-peach-400">當前小類別列表 (可拖曳排序)：</span>
                    </div>

                    <div class="flex items-center gap-2 flex-wrap">
                        <button onclick="openSubcategoryModal(false)" class="bg-peach-500/20 hover:bg-peach-500/30 text-peach-300 border border-peach-500/40 text-xs px-2.5 py-1.5 rounded-xl font-bold transition flex items-center gap-1">
                            ➕ 新增小類別
                        </button>
                        <button onclick="openSubcategoryModal(true)" class="bg-charcoal-900 hover:bg-white/10 text-xs px-2.5 py-1.5 rounded-xl border border-white/10 transition text-gray-300">
                            ✏️ 編輯小類別
                        </button>
                        <button onclick="requestDeleteCurrentSubcategory()" class="bg-rose-500/20 hover:bg-rose-500/30 text-xs px-2.5 py-1.5 rounded-xl border border-rose-500/40 transition text-rose-300 font-bold">
                            🗑️ 刪除小類別
                        </button>
                        
                        <div class="h-4 w-[1px] bg-white/10 mx-1 hidden sm:block"></div>

                        <label class="bg-charcoal-900 hover:bg-white/10 text-xs px-3 py-1.5 rounded-xl border border-white/10 cursor-pointer transition text-gray-200 flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5 text-peach-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                            批量新增本地圖片
                            <input type="file" id="file-input" multiple accept="image/*" onchange="handleBatchFileUpload(event)" class="hidden">
                        </label>

                        <button onclick="autoRenumberItems()" class="bg-charcoal-900 hover:bg-white/10 text-xs px-3 py-1.5 rounded-xl border border-white/10 transition text-gray-200">
                            🔢 自動依序編號
                        </button>
                    </div>
                </div>

                <div id="subcategory-tabs-container" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
                    <!-- 動態注入小類別頁籤 -->
                </div>
            </div>

            <!-- 作品卡片區 -->
            <div class="glass-panel p-5 rounded-3xl flex-1 flex flex-col min-h-[480px]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm font-bold text-white flex items-center gap-2">
                        <span>作品排序與預覽區</span>
                        <span id="item-count-badge" class="text-[10px] bg-peach-500/20 text-peach-400 border border-peach-500/30 px-2 py-0.5 rounded-full font-mono">0 張作品</span>
                    </h2>
                    <span id="selected-image-status" class="text-[11px] text-peach-300 font-mono">未選擇圖片 (點擊卡片選定後可 Ctrl+滾輪縮放)</span>
                </div>

                <div id="image-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 flex-1 align-content-start">
                    <!-- 動態注入作品卡片 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_FALLBACK_IMAGE = "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=800&q=80";

        // 完整包含 01~04 四大主題與小類別的預設資料庫
        let DATABASE = {
            "01": {
                title: "厚塗插畫",
                tag: "Digital Painting",
                desc: "光影筆觸堆疊、質感細節與氛圍感極佳的厚塗創作",
                bgImage: "assets/angle_0_0/01.jpg",
                bgFallback: DEFAULT_FALLBACK_IMAGE,
                folder: "assets/angle_0_0/01/",
                subcategories: [
                    {
                        name: "角色光影研究",

                        ]
                    },
                    {

                        items: [
                            { src: "assets/angle_0_0/01/B/01.jpg", fallback: DEFAULT_FALLBACK_IMAGE, name: "場景概念繪製 01" },
                            { src: "assets/angle_0_0/01/B/02.jpg", fallback: DEFAULT_FALLBACK_IMAGE, name: "幾何厚塗繪圖 02" }
                        ]
                    }
                ]
            },
            "02": {
                title: "日系插畫",
                tag: "Anime & Concept",
                desc: "動漫人物風格、二次元賽博朋克與角色設計專案",
                bgImage: "assets/angle_0_0/02.jpg",
                bgFallback: DEFAULT_FALLBACK_IMAGE,
                folder: "assets/angle_0_0/02/",
                subcategories: [
                    {
                        name: "賽博朋克系列",
                        folder: "A/",
                        items: [
                            { src: "assets/angle_0_0/02/A/01.jpg", fallback: DEFAULT_FALLBACK_IMAGE, name: "賽博朋克角色 01" },
                            { src: "assets/angle_0_0/02/A/02.jpg", fallback: DEFAULT_FALLBACK_IMAGE, name: "霓虹美學專案 02" }
                        ]
                    },
                    {
                        name: "二次元立繪專案",
                        folder: "B/",
                        items: [
                            { src: "assets/angle_0_0/02/B/01.jpg", fallback: DEFAULT_FALLBACK_IMAGE, name: "動漫立繪展示 01" },
                            { src: "assets/angle_0_0/02/B/02.jpg", fallback: DEFAULT_FALLBACK_IMAGE, name: "動態視覺設定 02" }
                        ]
                    }
                ]
            },
            "03": {
                title: "設計練習",
                tag: "Design Studies",
                desc: "速寫研究、色彩實驗、結構造型練習與概念研究",
                bgImage: "assets/angle_0_0/03.jpg",
                bgFallback: DEFAULT_FALLBACK_IMAGE,
                folder: "assets/angle_0_0/03/",
                subcategories: [
                    {
                        name: "人體與結構速寫",
                        folder: "A/",
                        items: [
                            { src: "assets/angle_0_0/03/A/01.jpg", fallback: DEFAULT_FALLBACK_IMAGE, name: "解剖與造型速寫 01" },
                            { src: "assets/angle_0_0/03/A/02.jpg", fallback: DEFAULT_FALLBACK_IMAGE, name: "明暗調子練習 02" }
                        ]
                    },
                    {
                        name: "透視與空間實驗",
                        folder: "B/",
                        items: [
                            { src: "assets/angle_0_0/03/B/01.jpg", fallback: DEFAULT_FALLBACK_IMAGE, name: "透視場景研究 01" },
                            { src: "assets/angle_0_0/03/B/02.jpg", fallback: DEFAULT_FALLBACK_IMAGE, name: "色彩球體實驗 02" }
                        ]
                    }
                ]
            },
            "04": {
                title: "黑線繪",
                tag: "Ink & Line Art",
                desc: "精細線稿、黑白點陣風格、漫畫風格線描作品",
                bgImage: "assets/angle_0_0/04.jpg",
                bgFallback: DEFAULT_FALLBACK_IMAGE,
                folder: "assets/angle_0_0/04/",
                subcategories: [
                    {
                        name: "456",
                        folder: "A/",
                        items: [
                            { src: "assets/angle_0_0/04/A/Life 01.png", fallback: DEFAULT_FALLBACK_IMAGE, name: "Life 01" },
                            { src: "assets/angle_0_0/04/A/Life 02.png", fallback: DEFAULT_FALLBACK_IMAGE, name: "Life 02" },
                            { src: "assets/angle_0_0/04/A/Life 03.png", fallback: DEFAULT_FALLBACK_IMAGE, name: "Life 03" }
                        ]
                    },
                    {
                        name: "測試",
                        folder: "B/",
                        items: [
                            { src: "assets/angle_0_0/04/B/01.jpg", fallback: DEFAULT_FALLBACK_IMAGE, name: "黑白點陣風格 01" },
                            { src: "assets/angle_0_0/04/B/02.jpg", fallback: DEFAULT_FALLBACK_IMAGE, name: "漫畫風分鏡稿 02" }
                        ]
                    }
                ]
            }
        };

        let activeCatKey = "01";
        let activeSubIdx = 0;
        let dragSrcIndex = null;
        let isEditingTheme = false;
        let isEditingSubcategory = false;
        let draggedTabKey = null;
        let draggedSubTabIdx = null;
        let pendingConfirmCallback = null;

        // 選定圖片操控狀態
        let selectedItemIdx = null;
        let imgTransforms = {}; // key: itemIdx -> { scale: 1.0, panX: 0, panY: 0 }
        let isCtrlPanning = false;
        let panStartX = 0, panStartY = 0;
        let panStartOffsetX = 0, panStartOffsetY = 0;

        function saveToLocalStorage() {
            try {
                const cleanDB = generateCleanJson();
                localStorage.setItem('PORTFOLIO_DATABASE', JSON.stringify(cleanDB));
            } catch (e) {
                console.warn('LocalStorage limit or restriction');
            }
        }

        async function fetchLocalPortfolioJson() {
            const pathsToTry = [
                'portfolio_data.json',
                'assets/angle_0_0/portfolio_data.json',
                './portfolio_data.json',
                '../portfolio_data.json'
            ];

            let loadedData = null;
            for (const path of pathsToTry) {
                try {
                    const res = await fetch(path);
                    if (res.ok) {
                        loadedData = await res.json();
                        if (loadedData && typeof loadedData === 'object' && Object.keys(loadedData).length > 0) {
                            break;
                        }
                    }
                } catch (e) {}
            }

            if (loadedData) {
                DATABASE = loadedData;
                reorderAndRenumberDatabaseKeys();
                saveToLocalStorage();
                showToast("✅ 已成功讀取 portfolio_data.json！");
            } else {
                const localSaved = localStorage.getItem('PORTFOLIO_DATABASE');
                if (localSaved) {
                    try {
                        DATABASE = JSON.parse(localSaved);
                        reorderAndRenumberDatabaseKeys();
                        showToast("✅ 已從本地快取同步最新資料庫！");
                        return;
                    } catch(e) {}
                }
                showToast("⚠️ 未找到相鄰 JSON，請點擊「選擇 JSON 檔案」匯入");
            }
        }

        function triggerJsonImport() {
            document.getElementById('json-file-input').click();
        }

        function handleJsonFileImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const jsonData = JSON.parse(evt.target.result);
                    if (jsonData && typeof jsonData === 'object' && Object.keys(jsonData).length > 0) {
                        DATABASE = jsonData;
                        reorderAndRenumberDatabaseKeys();
                        saveToLocalStorage();
                        showToast("✅ 已成功匯入 JSON 資料！");
                    } else {
                        showToast("⚠️ JSON 內容格式不正確");
                    }
                } catch (err) {
                    showToast("⚠️ JSON 解析失敗");
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('theme-tabs-container');
            let html = '';
            const keys = Object.keys(DATABASE);
            if (keys.length === 0) {
                tabsContainer.innerHTML = '<span class="text-xs text-gray-500">尚無主題</span>';
                renderSubcategoryTabs();
                return;
            }

            if (!DATABASE[activeCatKey]) {
                activeCatKey = keys[0];
            }

            keys.forEach((catKey, idx) => {
                const cat = DATABASE[catKey];
                const isActive = catKey === activeCatKey;
                const displayNum = String(idx + 1).padStart(2, '0');
                html += `
                    <div draggable="true"
                         data-tab-key="${catKey}"
                         ondragstart="handleTabDragStart(event, '${catKey}')"
                         ondragover="handleTabDragOver(event)"
                         ondrop="handleTabDrop(event, '${catKey}')"
                         ondragend="handleTabDragEnd(event)"
                         onclick="switchCategory('${catKey}')" 
                         class="px-3.5 py-2 rounded-xl text-xs font-bold transition cursor-grab active:cursor-grabbing flex-shrink-0 flex items-center gap-1.5 border select-none ${isActive ? 'bg-peach-500 text-charcoal-950 border-peach-500 shadow-md shadow-peach-500/20' : 'text-gray-300 hover:text-white hover:bg-white/5 border-white/10'}">
                        <span class="opacity-50 text-[10px]">⋮⋮</span>
                        <span>${displayNum}. ${cat.title}</span>
                    </div>
                `;
            });
            tabsContainer.innerHTML = html;
            renderSubcategoryTabs();
        }

        function handleTabDragStart(e, key) {
            draggedTabKey = key;
            e.currentTarget.classList.add('tab-dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleTabDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleTabDrop(e, targetKey) {
            e.preventDefault();
            if (!draggedTabKey || draggedTabKey === targetKey) return;

            const keys = Object.keys(DATABASE);
            const fromIndex = keys.indexOf(draggedTabKey);
            const toIndex = keys.indexOf(targetKey);

            if (fromIndex === -1 || toIndex === -1) return;

            // 僅調整 DATABASE 中的 key-value 順序，絕不改動 themeObj.folder 或圖片路徑
            const entries = keys.map(k => [k, DATABASE[k]]);
            const [movedEntry] = entries.splice(fromIndex, 1);
            entries.splice(toIndex, 0, movedEntry);

            const newDatabase = {};
            entries.forEach(([k, themeObj]) => {
                newDatabase[k] = themeObj;
            });

            DATABASE = newDatabase;
            saveToLocalStorage();
            renderTabs();
            showToast("已更換主題顯示順序！");
        }

        function handleTabDragEnd(e) {
            e.currentTarget.classList.remove('tab-dragging');
            draggedTabKey = null;
        }

        function reorderAndRenumberDatabaseKeys() {
            const keys = Object.keys(DATABASE);
            if (keys.length > 0 && !DATABASE[activeCatKey]) {
                activeCatKey = keys[0];
            }
            activeSubIdx = 0;
            saveToLocalStorage();
            renderTabs();
        }

        function switchCategory(catKey) {
            activeCatKey = catKey;
            activeSubIdx = 0;
            selectedItemIdx = null;
            imgTransforms = {};
            renderTabs();
        }

        function openThemeModal(editMode = false) {
            isEditingTheme = editMode;
            const modal = document.getElementById('theme-modal');
            const modalTitle = document.getElementById('theme-modal-title');
            const keyInput = document.getElementById('modal-theme-key');
            const titleInput = document.getElementById('modal-theme-title');
            const tagInput = document.getElementById('modal-theme-tag');
            const descInput = document.getElementById('modal-theme-desc');
            const bgInput = document.getElementById('modal-theme-bg');
            const folderInput = document.getElementById('modal-theme-folder');

            if (editMode) {
                const cur = DATABASE[activeCatKey];
                modalTitle.innerText = `編輯主題：${cur.title}`;
                keyInput.value = activeCatKey;
                titleInput.value = cur.title || '';
                tagInput.value = cur.tag || '';
                descInput.value = cur.desc || '';
                bgInput.value = cur.bgImage || `assets/angle_0_0/${activeCatKey}.jpg`;
                folderInput.value = cur.folder || `assets/angle_0_0/${activeCatKey}/`;
            } else {
                const nextNum = String(Object.keys(DATABASE).length + 1).padStart(2, '0');
                modalTitle.innerText = "新增主題";
                keyInput.value = nextNum;
                titleInput.value = '';
                tagInput.value = '';
                descInput.value = '';
                bgInput.value = `assets/angle_0_0/${nextNum}.jpg`;
                folderInput.value = `assets/angle_0_0/${nextNum}/`;
            }

            modal.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
        }

        function closeThemeModal() {
            document.getElementById('theme-modal').classList.add('hidden', 'opacity-0', 'pointer-events-none');
        }

        function saveThemeModal() {
            const key = document.getElementById('modal-theme-key').value.trim();
            const title = document.getElementById('modal-theme-title').value.trim();
            const tag = document.getElementById('modal-theme-tag').value.trim();
            const desc = document.getElementById('modal-theme-desc').value.trim();
            const bgImage = document.getElementById('modal-theme-bg').value.trim();
            const folder = document.getElementById('modal-theme-folder').value.trim();

            if (!title) {
                showToast("⚠️ 請填寫主題名稱！");
                return;
            }

            if (isEditingTheme) {
                DATABASE[activeCatKey].title = title;
                DATABASE[activeCatKey].tag = tag;
                DATABASE[activeCatKey].desc = desc;
                DATABASE[activeCatKey].bgImage = bgImage;
                DATABASE[activeCatKey].folder = folder;
            } else {
                DATABASE[key] = {
                    title: title,
                    tag: tag || 'Art Category',
                    desc: desc || '專案視覺創作展示',
                    bgImage: bgImage || `assets/angle_0_0/${key}.jpg`,
                    bgFallback: DEFAULT_FALLBACK_IMAGE,
                    folder: folder || `assets/angle_0_0/${key}/`,
                    subcategories: [
                        { name: "預設小類別", folder: "A/", items: [] }
                    ]
                };
                activeCatKey = key;
                activeSubIdx = 0;
            }

            closeThemeModal();
            saveToLocalStorage();
            renderTabs();
            showToast("已儲存主題資訊！");
        }

        function requestDeleteCurrentTheme() {
            const keys = Object.keys(DATABASE);
            if (keys.length <= 1) {
                showToast("⚠️ 最少需保留一個主題！");
                return;
            }

            const curTitle = DATABASE[activeCatKey] ? DATABASE[activeCatKey].title : activeCatKey;
            openConfirmModal("刪除主題", `確定要刪除主題「${curTitle}」嗎？`, function() {
                delete DATABASE[activeCatKey];

        function renderSubcategoryTabs() {
            const subContainer = document.getElementById('subcategory-tabs-container');
            if (!DATABASE[activeCatKey] || !DATABASE[activeCatKey].subcategories) {
                subContainer.innerHTML = '<span class="text-xs text-gray-500">尚無小類別</span>';
                renderImageGrid();

                activeSubIdx = Math.max(0, subcats.length - 1);

            subcats.forEach((sub, idx) => {
                const isActive = idx === activeSubIdx;
                html += `
                    <div draggable="true"
                         data-sub-idx="${idx}"

                         ondragend="handleSubTabDragEnd(event)"
                         onclick="switchSubcategory(${idx})" 
                         class="px-3 py-1.5 rounded-xl text-xs font-bold transition cursor-grab active:cursor-grabbing flex-shrink-0 flex items-center gap-1.5 border select-none ${isActive ? 'bg-peach-500 text-charcoal-950 border-peach-500 shadow-md shadow-peach-500/20' : 'text-gray-300 hover:text-white hover:bg-white/5 border-white/10'}">
                        <span class="opacity-50 text-[10px]">⋮⋮</span>

                    </div>

            subContainer.innerHTML = html;
            renderImageGrid();

        function handleSubTabDragStart(e, subIdx) {
            draggedSubTabIdx = subIdx;
            e.currentTarget.classList.add('sub-tab-dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleSubTabDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleSubTabDrop(e, targetSubIdx) {
            e.preventDefault();
            if (draggedSubTabIdx === null || draggedSubTabIdx === targetSubIdx) return;

            const subcats = DATABASE[activeCatKey].subcategories;
            // 僅調整小類別陣列中的順序，保留各小類別原本的 Folder 與圖片路徑
            const [movedSubcat] = subcats.splice(draggedSubTabIdx, 1);
            subcats.splice(targetSubIdx, 0, movedSubcat);

            if (activeSubIdx === draggedSubTabIdx) {
                activeSubIdx = targetSubIdx;
            } else if (activeSubIdx > draggedSubTabIdx && activeSubIdx <= targetSubIdx) {
                activeSubIdx--;
            } else if (activeSubIdx < draggedSubTabIdx && activeSubIdx >= targetSubIdx) {
                activeSubIdx++;
            }

            saveToLocalStorage();
            renderSubcategoryTabs();
            showToast("已更換小類別顯示順序！");
        }

        function handleSubTabDragEnd(e) {
            e.currentTarget.classList.remove('sub-tab-dragging');
            draggedSubTabIdx = null;
        }

            selectedItemIdx = null;

        }

        function saveSubcategoryModal() {

                return;
            }

            if (folder && !folder.endsWith('/')) {
                folder += '/';
            }

                subcats[activeSubIdx].name = name;
                subcats[activeSubIdx].folder = folder;
            } else {
                subcats.push({ name: name, folder: folder, items: [] });

        function requestDeleteCurrentSubcategory() {

        function renderImageGrid() {

                gridEl.innerHTML = `
                    <div class="col-span-full py-16 text-center text-gray-500 text-xs flex flex-col items-center gap-2">

                            點此批量新增本地圖片

                html += `
                    <div class="image-card group relative bg-charcoal-900 border border-white/10 rounded-2xl overflow-hidden shadow-lg p-2 flex flex-col justify-between transition-all duration-200 hover:border-peach-500/60 ${isSelected ? 'selected-card' : ''}"
                         draggable="true"
                         data-index="${idx}"
                         onclick="selectCard(${idx})"
                         ondragstart="handleDragStart(event, ${idx})"
                         ondragover="handleDragOver(event)"
                         ondrop="handleDrop(event, ${idx})"
                         ondragend="handleDragEnd(event)">
                        
                        <div class="flex justify-between items-center mb-1.5 px-1">
                            <span class="font-mono text-[10px] text-peach-400 font-bold">#${idx + 1}</span>
                            <div class="flex items-center gap-1">
                                <button onclick="event.stopPropagation(); removeItem(${idx})" title="刪除作品" class="p-1 hover:bg-rose-500/20 rounded text-rose-400 transition text-[10px]">✕</button>
                            </div>
                        </div>

                        <div class="interactive-img-container aspect-square rounded-xl overflow-hidden bg-black/40 mb-2 relative"
                             id="img-container-${idx}"
                             onmousedown="handleCardImgMouseDown(event, ${idx})"
                             onwheel="handleCardImgWheel(event, ${idx})">
                            <img id="card-img-${idx}"
                                 src="${previewSrc}" 
                                 alt="${item.name}" 
                                 class="interactive-img w-full h-full object-cover select-none pointer-events-none"

                                 data-fallback="${fallbackImg}"
                                 onerror="handleSmartImageError(this)">
                        </div>

                        <div class="space-y-1.5 text-[11px]" onclick="event.stopPropagation();">
                            <div>
                                <label class="text-[9px] text-gray-400">作品名稱：</label>
                                <input type="text" value="${item.name}" onchange="updateItemName(${idx}, this.value)" class="w-full bg-charcoal-950 border border-white/10 rounded-lg px-2 py-1 text-white text-[11px] focus:outline-none focus:border-peach-500">
                            </div>
                            <div>
                                <label class="text-[9px] text-gray-400">圖片路徑：</label>
                                <input type="text" value="${item.src}" onchange="updateItemSrc(${idx}, this.value)" class="w-full bg-charcoal-950 border border-white/10 rounded-lg px-2 py-1 text-gray-300 font-mono text-[10px] focus:outline-none focus:border-peach-500">

        // 選定卡片
        function selectCard(idx) {
            selectedItemIdx = idx;
            document.querySelectorAll('.image-card').forEach((card, i) => {
                if (i === idx) {
                    card.classList.add('selected-card');
                } else {
                    card.classList.remove('selected-card');
                }
            });
            updateSelectedImageStatusUI();
        }

        function updateSelectedImageStatusUI() {
            const statusEl = document.getElementById('selected-image-status');
            if (selectedItemIdx === null) {
                statusEl.innerText = "未選擇圖片 (點擊卡片選定後可 Ctrl+滾輪縮放)";
                statusEl.className = "text-[11px] text-gray-400 font-mono";
            } else {
                const subcat = DATABASE[activeCatKey].subcategories[activeSubIdx];
                const item = subcat && subcat.items ? subcat.items[selectedItemIdx] : null;
                const name = item ? item.name : `#${selectedItemIdx + 1}`;
                const transform = imgTransforms[selectedItemIdx] || { scale: 1, panX: 0, panY: 0 };
                const scalePct = Math.round(transform.scale * 100);
                statusEl.innerText = `已選定：${name} (${scalePct}%) | 按住 Ctrl + 滾輪/左鍵 操作`;
                statusEl.className = "text-[11px] text-peach-300 font-mono font-bold";
            }
        }

        // 智能三階段圖片探測降級機制
        function handleSmartImageError(img) {
            const originalSrc = img.getAttribute('data-original-src') || img.src;
            const fallback = img.getAttribute('data-fallback') || DEFAULT_FALLBACK_IMAGE;

            if (!img.dataset.tryStage) {
                img.dataset.tryStage = "1";
                // 階段 1：針對 code_artifact.html 位於 assets/angle_0_0/ 目錄下，若原路徑有 assets/angle_0_0/ 前綴，嘗試相對層級路徑
                let strippedPrefix = originalSrc.replace(/^assets\/angle_0_0\//, '');
                if (strippedPrefix !== originalSrc && img.src !== strippedPrefix) {
                    img.src = strippedPrefix;
                    return;
                }
            }

            if (img.dataset.tryStage === "1") {
                img.dataset.tryStage = "2";
                // 階段 2：若原路徑含子資料夾（如 `/A/`），自動嘗試去掉子資料夾（轉為 `.../04/Life 01.png`）
                let strippedSubcat = originalSrc.replace(/\/[A-Z]\//, '/').replace(/^assets\/angle_0_0\//, '');
                if (strippedSubcat !== originalSrc && img.src !== strippedSubcat) {
                    img.src = strippedSubcat;
                    return;
                }
            }

            // 階段 3：最終回退至雲端通用預設圖片
            img.onerror = null;
            img.src = fallback;
        }

        // 圖片 Ctrl + 滾輪縮放邏輯
        function handleCardImgWheel(e, idx) {
            if (!e.ctrlKey) return; // 僅在按住 Ctrl 鍵時觸發
            e.preventDefault();
            e.stopPropagation();

            selectCard(idx);

            const container = document.getElementById(`img-container-${idx}`);
            const img = document.getElementById(`card-img-${idx}`);
            if (!container || !img) return;

            let state = imgTransforms[idx] || { scale: 1.0, panX: 0, panY: 0 };

            // 計算最大縮放倍率 (不能超過圖片單邊極限尺寸或最大 3.0 倍)
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            const naturalW = img.naturalWidth || containerWidth;
            const naturalH = img.naturalHeight || containerHeight;

            // 計算最大允許 Scale (單邊尺寸達到圖片原始真實尺寸，最小不低於 3.0 倍)
            const maxScaleX = naturalW > 0 ? (naturalW / containerWidth) : 3.0;
            const maxScaleY = naturalH > 0 ? (naturalH / containerHeight) : 3.0;
            const maxAllowedScale = Math.max(1.5, Math.min(Math.max(maxScaleX, maxScaleY), 3.0));

            const delta = e.deltaY < 0 ? 0.15 : -0.15;
            let newScale = state.scale + delta;

            // 邊界限制：1.0x ~ maxAllowedScale
            newScale = Math.max(1.0, Math.min(newScale, maxAllowedScale));

            state.scale = newScale;

            // 重新限制 Pan 邊界
            clampPanBoundaries(state, containerWidth, containerHeight);

            imgTransforms[idx] = state;
            applyImgTransform(img, state);
            updateSelectedImageStatusUI();
        }

        // 圖片 Ctrl + 左鍵 拖曳平移邏輯
        function handleCardImgMouseDown(e, idx) {
            if (!e.ctrlKey || e.button !== 0) return; // Ctrl + 滑鼠左鍵
            e.preventDefault();
            e.stopPropagation();

            selectCard(idx);

            const container = document.getElementById(`img-container-${idx}`);
            const img = document.getElementById(`card-img-${idx}`);
            if (!container || !img) return;

            const state = imgTransforms[idx] || { scale: 1.0, panX: 0, panY: 0 };
            if (state.scale <= 1.0) return; // 未放大無需平移

            isCtrlPanning = true;
            panStartX = e.clientX;
            panStartY = e.clientY;
            panStartOffsetX = state.panX;
            panStartOffsetY = state.panY;

            const onMouseMove = (moveEvt) => {
                if (!isCtrlPanning) return;
                moveEvt.preventDefault();

                const dx = moveEvt.clientX - panStartX;
                const dy = moveEvt.clientY - panStartY;

                state.panX = panStartOffsetX + dx;
                state.panY = panStartOffsetY + dy;

                clampPanBoundaries(state, container.clientWidth, container.clientHeight);

                imgTransforms[idx] = state;
                applyImgTransform(img, state);
            };

            const onMouseUp = () => {
                isCtrlPanning = false;
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
            };

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }

        // 邊界鎖定算法：超過圖片邊界無法再拖曳
        function clampPanBoundaries(state, containerW, containerH) {
            if (state.scale <= 1.0) {
                state.panX = 0;
                state.panY = 0;
                return;
            }

            const maxPanX = (containerW * (state.scale - 1)) / 2;
            const maxPanY = (containerH * (state.scale - 1)) / 2;

            state.panX = Math.max(-maxPanX, Math.min(state.panX, maxPanX));
            state.panY = Math.max(-maxPanY, Math.min(state.panY, maxPanY));
        }

        function applyImgTransform(imgEl, state) {
            imgEl.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.scale})`;
        }

        function restoreAllImageTransforms() {
            Object.keys(imgTransforms).forEach(idxStr => {
                const idx = parseInt(idxStr, 10);
                const img = document.getElementById(`card-img-${idx}`);
                if (img) {
                    applyImgTransform(img, imgTransforms[idx]);
                }
            });
        }

        // 防止開啟整頁 Ctrl + 滾輪 網頁縮放
        window.addEventListener('wheel', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, { passive: false });

        function handleDragStart(e, idx) {
            dragSrcIndex = idx;
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e, targetIdx) {
            e.preventDefault();
            if (dragSrcIndex === null || dragSrcIndex === targetIdx) return;

            const items = DATABASE[activeCatKey].subcategories[activeSubIdx].items;
            const movedItem = items.splice(dragSrcIndex, 1)[0];
            items.splice(targetIdx, 0, movedItem);

            selectedItemIdx = targetIdx;
            imgTransforms = {};

            saveToLocalStorage();
            renderImageGrid();
            showToast("已更換作品順序！");
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            dragSrcIndex = null;
        }

        function removeItem(idx) {
            const items = DATABASE[activeCatKey].subcategories[activeSubIdx].items;
            items.splice(idx, 1);
            if (selectedItemIdx === idx) selectedItemIdx = null;
            imgTransforms = {};
            saveToLocalStorage();
            renderImageGrid();
            renderSubcategoryTabs();
            showToast("已刪除圖片！");
        }

        function updateItemName(idx, val) {
            DATABASE[activeCatKey].subcategories[activeSubIdx].items[idx].name = val;
            saveToLocalStorage();
        }

        function updateItemSrc(idx, val) {
            DATABASE[activeCatKey].subcategories[activeSubIdx].items[idx].src = val;
            saveToLocalStorage();
        }

        function handleBatchFileUpload(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            const cat = DATABASE[activeCatKey];
            const subcat = cat.subcategories[activeSubIdx];

            files.forEach((file) => {
                const fileNameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                const generatedSrc = `${cat.folder}${subcat.folder || ''}${file.name}`;
                const previewBlob = URL.createObjectURL(file);

                subcat.items.push({
                    src: generatedSrc,
                    fallback: DEFAULT_FALLBACK_IMAGE,
                    name: fileNameWithoutExt,
                    previewBlob: previewBlob
                });
            });

            saveToLocalStorage();
            renderImageGrid();
            renderSubcategoryTabs();
            showToast(`已成功新增 ${files.length} 張圖片！`);
            e.target.value = '';
        }

        function autoRenumberItems() {
            const cat = DATABASE[activeCatKey];
            const subcat = cat.subcategories[activeSubIdx];

            subcat.items.forEach((item, idx) => {
                const paddedNum = String(idx + 1).padStart(2, '0');
                item.name = `${subcat.name} ${paddedNum}`;
                const ext = item.src.split('.').pop() || 'jpg';
                item.src = `${cat.folder}${subcat.folder || ''}${paddedNum}.${ext}`;
            });

            saveToLocalStorage();
            renderImageGrid();
            showToast("已完成所有圖片重新編號！");
        }

        function generateCleanJson() {
            const cleanDB = JSON.parse(JSON.stringify(DATABASE));
            Object.keys(cleanDB).forEach(cKey => {
                cleanDB[cKey].subcategories.forEach(sub => {
                    sub.items.forEach(item => {
                        delete item.previewBlob;
                    });
                });
            });
            return cleanDB;
        }

        function downloadJsonData() {
            const cleanDB = generateCleanJson();
            const jsonStr = JSON.stringify(cleanDB, null, 4);
            const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'portfolio_data.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("📄 已下載 portfolio_data.json！");
        }

        function openConfirmModal(title, msg, onConfirm) {
            document.getElementById('confirm-modal-title').innerText = title;
            document.getElementById('confirm-modal-msg').innerText = msg;
            pendingConfirmCallback = onConfirm;

            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.add('hidden', 'opacity-0', 'pointer-events-none');
            pendingConfirmCallback = null;
        }

        function executeConfirmAction() {
            if (typeof pendingConfirmCallback === 'function') {
                pendingConfirmCallback();
            }
            closeConfirmModal();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            msgEl.innerText = msg;
            toast.classList.remove('opacity-0', '-translate-y-2', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-2', 'pointer-events-none');
            }, 2000);
        }

        window.onload = function() {
            // 初始化時自動嘗試抓取相鄰同目錄下的 portfolio_data.json
            fetchLocalPortfolioJson().then(() => {
                renderTabs();
            }).catch(() => {
                const localSaved = localStorage.getItem('PORTFOLIO_DATABASE');
                if (localSaved) {
                    try {
                        const parsed = JSON.parse(localSaved);
                        if (parsed && Object.keys(parsed).length > 1) {
                            DATABASE = parsed;
                        }
                    } catch(e) {}
                }
                renderTabs();
            });
        };
    </script>
</body>
</html>
