<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精選個人作品 - 專案展演</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        peach: {
                            300: '#fde5be',
                            400: '#fcd8a0',
                            500: '#fcd191',
                            600: '#e0b879',
                        },
                        charcoal: {
                            800: '#2c2c31',
                            850: '#232327',
                            900: '#1c1c1f',
                            950: '#141416',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #141416;
            color: #f3f4f6;
            overflow: hidden;
        }
        .glass-panel {
            background: rgba(35, 35, 39, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* VisionOS 3D Perspective Stage Styles */
        .pc-3d-stage {
            perspective: 1200px;
            perspective-origin: 50% 50%;
            transform-style: preserve-3d;
        }
        .pc-3d-cards-wrapper {
            transform-style: preserve-3d;
        }
        .pc-3d-card {
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease, filter 0.4s ease;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            will-change: transform, opacity, filter;
        }
    </style>
</head>
<body class="p-1 md:p-2 pt-1 md:pt-1 min-h-screen bg-charcoal-950 no-scrollbar selection:bg-peach-500 selection:text-charcoal-950 overflow-hidden">

    <div id="angle00-wrapper" class="relative w-full h-full max-w-[1536px] mx-auto text-gray-100 flex flex-col justify-between overflow-hidden pt-0">
        
        <!-- 1. Top Bar: Theme Tags (Centered) & Close Button (Top-Rightmost, Same Height) -->
        <div class="relative w-full flex items-center justify-between z-40 mb-1 flex-shrink-0 px-1 md:px-2">
            <!-- Invisible Spacer for visual centering balance -->
            <div class="w-8 h-8 opacity-0 pointer-events-none hidden sm:block"></div>

            <!-- Theme Navigation Tags -->
            <div class="glass-panel px-3 py-1 rounded-full border border-peach-500/30 shadow-2xl flex items-center gap-1.5 md:gap-2 overflow-x-auto no-scrollbar max-w-[80vw] md:max-w-[70vw] mx-auto">
                <div id="angle00-theme-tags" class="flex items-center gap-1.5 md:gap-2">
                    <!-- Injected dynamically via JS -->
                </div>
            </div>

            <!-- Top-Right Close Button (Aligned height with theme tags) -->
            <button onclick="window.angle00CloseModal()" 
                    class="w-8 h-8 rounded-xl glass-panel flex items-center justify-center text-xs text-gray-300 hover:text-white hover:bg-rose-500/20 hover:border-rose-400/50 transition border border-white/10 shadow-md flex-shrink-0 ml-auto sm:ml-0"
                    title="關閉作品面板">
                ✕
            </button>
        </div>

        <!-- Stage Header Bar: Subcategory Tags (Left) & Counter (Right-Aligned) -->
        <header class="relative flex items-center justify-between gap-3 pb-1.5 border-b border-white/10 px-2 md:px-4 z-30 flex-shrink-0">
            <div class="flex items-center gap-3">
                <div id="angle00-subcat-tags" class="flex items-center gap-1.5 md:gap-2 overflow-x-auto no-scrollbar py-0.5 max-w-[55vw] md:max-w-[48vw]">
                    <!-- Subcategory tag buttons injected dynamically via JS -->
                </div>
            </div>

            <!-- Page Counter aligned to the far right -->
            <div class="flex items-center gap-3 ml-auto">
                <span id="angle00-lightbox-counter" class="font-mono bg-white/10 px-3 py-1 rounded-full text-xs text-peach-300 font-bold">
                    1 / 10
                </span>
            </div>
        </header>

        <!-- Main 3D Spatial Lightbox Stage -->
        <div id="angle00-lightbox-stage-container" class="relative flex-1 w-full max-w-[1536px] flex items-center justify-center my-0.5 overflow-hidden cursor-grab active:cursor-grabbing pc-3d-stage">
            <div id="angle00-lightbox-toast" 
                 class="absolute top-2 z-40 px-4 py-1.5 rounded-full bg-peach-500 text-charcoal-950 font-bold text-xs shadow-2xl backdrop-blur-md transition-all duration-500 opacity-0 -translate-y-4 pointer-events-none">
                <span id="angle00-toast-text">已切換主題</span>
            </div>

            <!-- Mobile Navigation Arrow Left -->
            <button id="angle00-nav-btn-prev" onclick="event.stopPropagation(); window.angle00NavImage(-1);" 
                    class="absolute left-2 z-30 w-10 h-10 rounded-full bg-charcoal-900/90 hover:bg-peach-500 hover:text-charcoal-950 border border-white/20 text-white flex items-center justify-center transition shadow-2xl font-bold">
                ‹
            </button>

            <!-- Stage Workspace for VisionOS 3D Spatial Cards -->
            <div id="angle00-lightbox-cards-wrapper" class="relative w-full h-full flex items-center justify-center pc-3d-cards-wrapper">
                <!-- Dynamic VisionOS 3D Spatial Glass Cards -->
            </div>

            <!-- Mobile Navigation Arrow Right -->
            <button id="angle00-nav-btn-next" onclick="event.stopPropagation(); window.angle00NavImage(1);" 
                    class="absolute right-2 z-30 w-10 h-10 rounded-full bg-charcoal-900/90 hover:bg-peach-500 hover:text-charcoal-950 border border-white/20 text-white flex items-center justify-center transition shadow-2xl font-bold">
                ›
            </button>
        </div>

        <!-- Bottom Thumbnail Strip Container -->
        <div class="w-full max-w-[1536px] py-0.5 px-1 flex-shrink-0">
            <div id="angle00-thumb-strip" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5 px-0 justify-start cursor-grab active:cursor-grabbing select-none">
                <!-- Dynamic thumbnails injected here -->
            </div>
        </div>

    </div>

    <script>
        (function() {
            const DEFAULT_DATABASE = {
                "01": {
                    title: "厚塗插畫",
                    tag: "Digital Painting",
                    desc: "光影筆觸堆疊、質感細節與氛圍感極佳的厚塗創作",
                    bgImage: "assets/angle_0_0/01.jpg",
                    bgFallback: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=800&q=80",
                    folder: "assets/angle_0_0/01/",
                    subcategories: [
                        {
                            name: "角色光影研究",
                            folder: "A/",
                            items: [
                                { src: "assets/angle_0_0/01/A/01.jpg", fallback: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=1348&q=80", name: "角色光影研究 01" },
                                { src: "assets/angle_0_0/01/A/02.jpg", fallback: "https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=1348&q=80", name: "角色光影研究 02" },
                                { src: "assets/angle_0_0/01/A/03.jpg", fallback: "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=1348&q=80", name: "質感色彩練習 03" }
                            ]
                        },
                        {
                            name: "概念場景氛圍",
                            folder: "B/",
                            items: [
                                { src: "assets/angle_0_0/01/B/01.jpg", fallback: "https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1348&q=80", name: "場景概念繪製 01" },
                                { src: "assets/angle_0_0/01/B/02.jpg", fallback: "https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?auto=format&fit=crop&w=1348&q=80", name: "幾態厚塗繪圖 02" }
                            ]
                        }
                    ]
                },
                "02": {
                    title: "日系插畫",
                    tag: "Anime & Concept",
                    desc: "動漫人物風格、二次元賽博朋克與角色設計專案",
                    bgImage: "assets/angle_0_0/02.jpg",
                    bgFallback: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80",
                    folder: "assets/angle_0_0/02/",
                    subcategories: [
                        {
                            name: "賽博朋克系列",
                            folder: "A/",
                            items: [
                                { src: "assets/angle_0_0/02/A/01.jpg", fallback: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1348&q=80", name: "賽博朋克角色 01" },
                                { src: "assets/angle_0_0/02/A/02.jpg", fallback: "https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=1348&q=80", name: "霓虹美學專案 02" }
                            ]
                        },
                        {
                            name: "二次元立繪專案",
                            folder: "B/",
                            items: [
                                { src: "assets/angle_0_0/02/B/01.jpg", fallback: "https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?auto=format&fit=crop&w=1348&q=80", name: "動漫立繪展示 01" },
                                { src: "assets/angle_0_0/02/B/02.jpg", fallback: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1348&q=80", name: "動態視覺設定 02" }
                            ]
                        }
                    ]
                },
                "03": {
                    title: "練習作品",
                    tag: "Studies & Sketches",
                    desc: "速寫研究、色彩實驗、結構造型練習與概念研究",
                    bgImage: "assets/angle_0_0/03.jpg",
                    bgFallback: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=800&q=80",
                    folder: "assets/angle_0_0/03/",
                    subcategories: [
                        {
                            name: "人態與結構速寫",
                            folder: "A/",
                            items: [
                                { src: "assets/angle_0_0/03/A/01.jpg", fallback: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=1348&q=80", name: "解剖與造型速寫 01" },
                                { src: "assets/angle_0_0/03/A/02.jpg", fallback: "https://images.unsplash.com/photo-1582562124811-c09040d0a901?auto=format&fit=crop&w=1348&q=80", name: "明暗調子練習 02" }
                            ]
                        },
                        {
                            name: "透視與空間實驗",
                            folder: "B/",
                            items: [
                                { src: "assets/angle_0_0/03/B/01.jpg", fallback: "https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1348&q=80", name: "透視場景研究 01" },
                                { src: "assets/angle_0_0/03/B/02.jpg", fallback: "https://images.unsplash.com/photo-1501084291732-13b1ba830ee4?auto=format&fit=crop&w=1348&q=80", name: "色彩球體實驗 02" }
                            ]
                        }
                    ]
                },
                "04": {
                    title: "黑線繪",
                    tag: "Ink & Line Art",
                    desc: "精細線稿、黑白點陣風格、漫畫風格線描作品",
                    bgImage: "assets/angle_0_0/04.jpg",
                    bgFallback: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=800&q=80",
                    folder: "assets/angle_0_0/04/",
                    subcategories: [
                        {
                            name: "精細墨線繪圖",
                            folder: "A/",
                            items: [
                                { src: "assets/angle_0_0/04/A/01.jpg", fallback: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=1348&q=80", name: "精細墨線繪圖 01" },
                                { src: "assets/angle_0_0/04/A/02.jpg", fallback: "https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1348&q=80", name: "結構線描稿 02" }
                            ]
                        },
                        {
                            name: "黑白漫畫分鏡",
                            folder: "B/",
                            items: [
                                { src: "assets/angle_0_0/04/B/01.jpg", fallback: "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=1348&q=80", name: "黑白點陣風格 01" },
                                { src: "assets/angle_0_0/04/B/02.jpg", fallback: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1348&q=80", name: "漫畫風分鏡稿 02" }
                            ]
                        }
                    ]
                }
            };

            let DATABASE = DEFAULT_DATABASE;
            let activeCategoryKey = "01";
            let flatImageList = [];
            let activeGlobalImageIndex = 0;

            // Aspect ratio cache for dynamic 3D stage layout calculations
            const aspectRatioCache = {};

            let touchStartX = 0;
            let touchEndX = 0;
            let isDraggingThumbStrip = false;
            let isProgrammaticScroll = false;
            let scrollSnapTimer = null;
            let inertiaAnimationId = null;

            function isPCView() {
                return window.innerWidth >= 768;
            }

            window.initAngle00App = async function() {
                const pathsToTry = [
                    'assets/angle_0_0/portfolio_data.json',
                    'portfolio_data.json',
                    './portfolio_data.json',
                    '../portfolio_data.json'
                ];

                let loadedData = null;
                for (const path of pathsToTry) {
                    try {
                        const res = await fetch(path, { cache: 'no-store' });
                        if (res.ok) {
                            const rawJson = await res.json();
                            if (rawJson && typeof rawJson === 'object' && Object.keys(rawJson).length > 0) {
                                loadedData = rawJson;
                                break;
                            }
                        }
                    } catch (e) {}
                }

                if (loadedData) {
                    DATABASE = loadedData;
                } else {
                    DATABASE = DEFAULT_DATABASE;
                }

                const keys = Object.keys(DATABASE);
                if (keys.length > 0) {
                    activeCategoryKey = keys[0];
                }

                renderThemeTags();
                switchThemeCategory(activeCategoryKey, false);

                setupTouchSwiping();
                setupLightboxMouseDrag();
                setupThumbStripMouseDrag();
                setupThumbStripScrollAndSnap();

                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        renderLightboxImage(false);
                    }, 100);
                });
            };

            function renderThemeTags() {
                const tagsContainer = document.getElementById('angle00-theme-tags');
                if (!tagsContainer) return;

                let html = '';
                Object.keys(DATABASE).forEach(catKey => {
                    const cat = DATABASE[catKey];
                    if (!cat || !cat.title) return;

                    const isActive = catKey === activeCategoryKey;
                    html += `
                        <button onclick="window.angle00SelectTheme('${catKey}')" 
                                class="btn-theme-tag px-3 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border flex-shrink-0 cursor-pointer ${
                                    isActive 
                                    ? 'bg-peach-500 text-charcoal-950 border-peach-500 shadow-md shadow-peach-500/20 font-extrabold' 
                                    : 'glass-panel text-gray-300 hover:text-white hover:bg-white/10 border-white/10'
                                }">
                            ${cat.title}
                        </button>
                    `;
                });
                tagsContainer.innerHTML = html;
            }

            window.angle00SelectTheme = function(catKey) {
                if (catKey === activeCategoryKey || !DATABASE[catKey]) return;
                switchThemeCategory(catKey, true);
            };

            function switchThemeCategory(catKey, showToast) {
                activeCategoryKey = catKey;
                const categoryData = DATABASE[catKey];
                if (!categoryData) return;

                renderThemeTags();

                flatImageList = [];
                let globalIndex = 0;

                if (Array.isArray(categoryData.subcategories)) {
                    categoryData.subcategories.forEach((subCat) => {
                        if (Array.isArray(subCat.items)) {
                            subCat.items.forEach((item) => {
                                flatImageList.push({
                                    ...item,
                                    subCatName: subCat.name,
                                    globalIndex: globalIndex
                                });
                                globalIndex++;
                            });
                        }
                    });
                }

                activeGlobalImageIndex = 0;
                renderLightboxImage(false);
                renderThumbStrip();

                if (showToast) {
                    triggerSubcategoryToast(`主題：${categoryData.title}`);
                }
            }

            window.angle00NavImage = function(direction) {
                if (!flatImageList || flatImageList.length === 0) return;
                const prevSubCat = flatImageList[activeGlobalImageIndex] ? flatImageList[activeGlobalImageIndex].subCatName : '';

                activeGlobalImageIndex = (activeGlobalImageIndex + direction + flatImageList.length) % flatImageList.length;
                const newSubCat = flatImageList[activeGlobalImageIndex] ? flatImageList[activeGlobalImageIndex].subCatName : '';

                renderLightboxImage(prevSubCat !== newSubCat);
                updateThumbStripActiveState();
            };

            window.angle00JumpToImage = function(index) {
                if (isDraggingThumbStrip) {
                    isDraggingThumbStrip = false;
                    return;
                }
                if (index < 0 || index >= flatImageList.length) return;
                const prevSubCat = flatImageList[activeGlobalImageIndex] ? flatImageList[activeGlobalImageIndex].subCatName : '';
                activeGlobalImageIndex = index;
                const newSubCat = flatImageList[activeGlobalImageIndex] ? flatImageList[activeGlobalImageIndex].subCatName : '';
                renderLightboxImage(prevSubCat !== newSubCat);
                updateThumbStripActiveState();
            };

            function renderSubcategoryTags() {
                const subcatContainer = document.getElementById('angle00-subcat-tags');
                if (!subcatContainer) return;

                const categoryData = DATABASE[activeCategoryKey];
                if (!categoryData || !Array.isArray(categoryData.subcategories)) {
                    subcatContainer.innerHTML = '';
                    return;
                }

                const currentItem = flatImageList[activeGlobalImageIndex];
                const currentSubCatName = currentItem ? currentItem.subCatName : '';

                let html = '';
                categoryData.subcategories.forEach((subCat) => {
                    const firstImgIndex = flatImageList.findIndex(img => img.subCatName === subCat.name);
                    const isActive = (subCat.name === currentSubCatName);

                    if (firstImgIndex !== -1) {
                        html += `
                            <button onclick="window.angle00JumpToImage(${firstImgIndex})" 
                                    class="px-2.5 py-1 rounded-xl text-xs font-bold transition flex-shrink-0 cursor-pointer border ${
                                        isActive 
                                        ? 'bg-peach-500 text-charcoal-950 border-peach-500 shadow-md shadow-peach-500/20 font-extrabold' 
                                        : 'glass-panel text-gray-300 hover:text-white hover:bg-white/10 border-white/10'
                                    }">
                                ${subCat.name}
                            </button>
                        `;
                    }
                });
                subcatContainer.innerHTML = html;
            }

            function ensureImageAspectRatioLoaded(item, callback) {
                if (!item || !item.src) return;
                if (aspectRatioCache[item.src]) {
                    callback(aspectRatioCache[item.src]);
                    return;
                }

                const img = new Image();
                img.onload = () => {
                    const ratio = img.naturalWidth / Math.max(1, img.naturalHeight);
                    aspectRatioCache[item.src] = ratio;
                    callback(ratio);
                };
                img.onerror = () => {
                    aspectRatioCache[item.src] = 1.0;
                    callback(1.0);
                };
                img.src = item.src;
            }

            function renderLightboxImage(showToast) {
                const currentItem = flatImageList[activeGlobalImageIndex];
                if (!currentItem) return;

                const counterEl = document.getElementById('angle00-lightbox-counter');
                const btnPrev = document.getElementById('angle00-nav-btn-prev');
                const btnNext = document.getElementById('angle00-nav-btn-next');
                const cardsWrapper = document.getElementById('angle00-lightbox-cards-wrapper');

                if (counterEl) counterEl.innerText = `${activeGlobalImageIndex + 1} / ${flatImageList.length}`;

                renderSubcategoryTags();

                const isPC = isPCView();

                if (isPC) {
                    if (btnPrev) btnPrev.style.display = 'none';
                    if (btnNext) btnNext.style.display = 'none';

                    const total = flatImageList.length;
                    const relativeOffsets = [-2, -1, 0, 1, 2];

                    // Determine active image aspect ratio (default 1.2 if not cached yet)
                    const activeRatio = aspectRatioCache[currentItem.src] || 1.2;

                    let shiftX1 = 360;
                    if (activeRatio > 1.25) {
                        shiftX1 = Math.min(560, Math.round(360 + (activeRatio - 1.25) * 190));
                    }
                    const shiftX2 = shiftX1 + 270;

                    let html = '';
                    relativeOffsets.forEach(offset => {
                        const targetIdx = activeGlobalImageIndex + offset;
                        if (targetIdx < 0 || targetIdx >= total) return;

                        const item = flatImageList[targetIdx];
                        if (!item) return;

                        let transformCss = '';
                        let zIndex = 10;
                        let opacity = 1;
                        let filterCss = '';

                        // VisionOS 3D Spatial Perspective Layout (Darkened side preview cards)
                        if (offset === 0) {
                            // Center Primary Card - Full Focus & Brightness
                            transformCss = 'translateX(0px) translateZ(180px) rotateY(0deg) scale(1.0)';
                            zIndex = 30;
                            opacity = 1.0;
                            filterCss = 'brightness(100%) contrast(100%)';
                        } else if (offset === -1) {
                            // Left Adjacent Card (-1) - Darker (45% brightness) to highlight main image
                            transformCss = `translateX(-${shiftX1}px) translateZ(-20px) rotateY(34deg) scale(0.82)`;
                            zIndex = 20;
                            opacity = 0.70;
                            filterCss = 'brightness(45%) contrast(90%)';
                        } else if (offset === 1) {
                            // Right Adjacent Card (+1) - Darker (45% brightness)
                            transformCss = `translateX(${shiftX1}px) translateZ(-20px) rotateY(-34deg) scale(0.82)`;
                            zIndex = 20;
                            opacity = 0.70;
                            filterCss = 'brightness(45%) contrast(90%)';
                        } else if (offset === -2) {
                            // Far Left Card (-2) - Very Dark (25% brightness)
                            transformCss = `translateX(-${shiftX2}px) translateZ(-200px) rotateY(54deg) scale(0.65)`;
                            zIndex = 10;
                            opacity = 0.40;
                            filterCss = 'brightness(25%) contrast(85%)';
                        } else if (offset === 2) {
                            // Far Right Card (+2) - Very Dark (25% brightness)
                            transformCss = `translateX(${shiftX2}px) translateZ(-200px) rotateY(-54deg) scale(0.65)`;
                            zIndex = 10;
                            opacity = 0.40;
                            filterCss = 'brightness(25%) contrast(85%)';
                        }

                        html += `
                            <div onclick="event.stopPropagation(); window.angle00NavImage(${offset});"
                                 class="pc-3d-card absolute flex flex-col items-center justify-center cursor-pointer select-none"
                                 style="transform: ${transformCss}; z-index: ${zIndex}; opacity: ${opacity}; filter: ${filterCss};">
                                
                                <img src="${item.src}" 
                                     draggable="false"
                                     decoding="async"
                                     class="max-h-[64vh] max-w-[56vw] w-auto h-auto object-contain rounded-2xl shadow-2xl border border-white/20 transition-all duration-300 pointer-events-none select-none"
                                     onerror="this.onerror=null; this.src='${item.fallback || 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=800&q=80'}';">

                                <div class="mt-3 px-3.5 py-1 rounded-full glass-panel border border-white/10 text-center max-w-[360px] shadow-lg truncate">
                                    <h4 class="text-xs font-bold text-white truncate">${item.name}</h4>
                                </div>
                            </div>
                        `;
                    });

                    cardsWrapper.innerHTML = html;

                    if (!aspectRatioCache[currentItem.src]) {
                        ensureImageAspectRatioLoaded(currentItem, () => {
                            renderLightboxImage(false);
                        });
                    }
                } else {
                    if (btnPrev) btnPrev.style.display = 'flex';
                    if (btnNext) btnNext.style.display = 'flex';

                    cardsWrapper.innerHTML = `
                        <div class="flex flex-col items-center justify-center max-h-[70vh]">
                            <img id="angle00-lightbox-img" 
                                 src="${currentItem.src}" 
                                 draggable="false"
                                 decoding="async"
                                 class="max-w-full max-h-[60vh] w-auto h-auto object-contain rounded-xl shadow-2xl transition-transform duration-200 select-none border border-white/20"
                                 onerror="this.onerror=null; this.src='${currentItem.fallback || 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=800&q=80'}';"
                                 alt="Full Artwork Detail">

                            <div class="mt-3 px-3.5 py-1 rounded-full glass-panel border border-white/10 text-center max-w-[300px] shadow-lg truncate">
                                <h4 class="text-xs font-bold text-white truncate">${currentItem.name}</h4>
                            </div>
                        </div>
                    `;
                }

                if (showToast) triggerSubcategoryToast(currentItem.subCatName);
            }

            function renderThumbStrip() {
                const stripEl = document.getElementById('angle00-thumb-strip');
                if (!stripEl) return;

                let html = '<div style="width: calc(50% + 3rem); flex-shrink: 0; height: 1px; pointer-events: none;"></div>';
                flatImageList.forEach((item, idx) => {
                    const isActive = idx === activeGlobalImageIndex;
                    html += `
                        <div onclick="window.angle00JumpToImage(${idx})" 
                             data-thumb-idx="${idx}"
                             class="thumb-item flex-shrink-0 w-16 h-16 rounded-xl overflow-hidden border-2 cursor-pointer transition-all duration-200 ${isActive ? 'border-peach-500 scale-105 shadow-lg shadow-peach-500/20' : 'border-white/20 opacity-60 hover:opacity-100'}">
                            <img src="${item.src}" 
                                 draggable="false" 
                                 decoding="async" 
                                 loading="lazy" 
                                 class="w-full h-full object-cover select-none" 
                                 onerror="this.onerror=null; this.src='${item.fallback || 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=800&q=80'}';">
                        </div>
                    `;
                });
                html += '<div style="width: calc(50% + 3rem); flex-shrink: 0; height: 1px; pointer-events: none;"></div>';
                stripEl.innerHTML = html;
                centerActiveThumbnail(false);
            }

            function updateThumbStripActiveState() {
                updateThumbOutlineOnly();
                centerActiveThumbnail(true);
            }

            function updateThumbOutlineOnly() {
                const stripEl = document.getElementById('angle00-thumb-strip');
                if (!stripEl) return;

                const thumbs = stripEl.querySelectorAll('.thumb-item');
                thumbs.forEach((el, idx) => {
                    if (idx === activeGlobalImageIndex) {
                        el.className = "thumb-item flex-shrink-0 w-16 h-16 rounded-xl overflow-hidden border-2 border-peach-500 scale-105 shadow-lg shadow-peach-500/20 cursor-pointer transition-all duration-200";
                    } else {
                        el.className = "thumb-item flex-shrink-0 w-16 h-16 rounded-xl overflow-hidden border-2 border-white/20 opacity-60 hover:opacity-100 cursor-pointer transition-all duration-200";
                    }
                });
            }

            function centerActiveThumbnail(smooth = true) {
                requestAnimationFrame(() => {
                    const stripEl = document.getElementById('angle00-thumb-strip');
                    if (!stripEl) return;
                    const activeEl = stripEl.querySelector(`[data-thumb-idx="${activeGlobalImageIndex}"]`);
                    if (!activeEl) return;

                    const containerWidth = stripEl.clientWidth;
                    const itemCenter = activeEl.offsetLeft + activeEl.clientWidth / 2;
                    const scrollTarget = itemCenter - (containerWidth / 2);

                    isProgrammaticScroll = true;
                    stripEl.scrollTo({
                        left: scrollTarget,
                        behavior: smooth ? 'smooth' : 'auto'
                    });
                    setTimeout(() => {
                        isProgrammaticScroll = false;
                    }, smooth ? 320 : 40);
                });
            }

            function snapClosestThumbnailToCenter() {
                const stripEl = document.getElementById('angle00-thumb-strip');
                if (!stripEl) return;
                const activeEl = stripEl.querySelector(`[data-thumb-idx="${activeGlobalImageIndex}"]`);
                if (!activeEl) return;

                const containerWidth = stripEl.clientWidth;
                const itemCenter = activeEl.offsetLeft + activeEl.clientWidth / 2;
                const scrollTarget = itemCenter - (containerWidth / 2);

                isProgrammaticScroll = true;
                stripEl.scrollTo({
                    left: scrollTarget,
                    behavior: 'smooth'
                });
                setTimeout(() => {
                    isProgrammaticScroll = false;
                }, 280);
            }

            function triggerSubcategoryToast(textMsg) {
                const toastEl = document.getElementById('angle00-lightbox-toast');
                const toastTextEl = document.getElementById('angle00-toast-text');

                if (toastEl && toastTextEl) {
                    toastTextEl.innerText = textMsg;
                    toastEl.classList.remove('opacity-0', '-translate-y-4');
                    toastEl.classList.add('opacity-100', 'translate-y-0');

                    setTimeout(() => {
                        toastEl.classList.remove('opacity-100', 'translate-y-0');
                        toastEl.classList.add('opacity-0', '-translate-y-4');
                    }, 1800);
                }
            }

            window.angle00CloseModal = function() {
                const modalDetails = document.getElementById('modal-details');
                if (modalDetails) {
                    modalDetails.classList.add('opacity-0', 'pointer-events-none', 'hidden');
                }
                if (typeof window.closeModalFallback === 'function') {
                    try {
                        window.closeModalFallback();
                    } catch (e) {
                        console.warn('closeModalFallback error:', e);
                    }
                }
            };

            function setupLightboxMouseDrag() {
                const lightboxEl = document.getElementById('angle00-lightbox-stage-container');
                if (!lightboxEl) return;

                let isMouseDown = false;
                let startX = 0;

                lightboxEl.addEventListener('dragstart', (e) => e.preventDefault());

                lightboxEl.addEventListener('mousedown', (e) => {
                    if (e.target.closest('button') || e.target.closest('#angle00-thumb-strip')) return;
                    isMouseDown = true;
                    startX = e.clientX;
                });

                lightboxEl.addEventListener('mouseup', (e) => {
                    if (!isMouseDown) return;
                    isMouseDown = false;
                    const diffX = e.clientX - startX;
                    if (Math.abs(diffX) > 40) {
                        if (diffX < 0) window.angle00NavImage(1);
                        else window.angle00NavImage(-1);
                    }
                });

                lightboxEl.addEventListener('mouseleave', () => {
                    isMouseDown = false;
                });
            }

            function setupThumbStripMouseDrag() {
                const stripEl = document.getElementById('angle00-thumb-strip');
                if (!stripEl) return;

                let isMouseDown = false;
                let startX = 0;
                let scrollLeft = 0;
                let dragDistance = 0;
                let velocity = 0;
                let lastX = 0;
                let lastTime = 0;

                stripEl.addEventListener('dragstart', (e) => e.preventDefault());

                function stopInertia() {
                    if (inertiaAnimationId) {
                        cancelAnimationFrame(inertiaAnimationId);
                        inertiaAnimationId = null;
                    }
                }

                stripEl.addEventListener('mousedown', (e) => {
                    stopInertia();
                    isMouseDown = true;
                    dragDistance = 0;
                    startX = e.pageX - stripEl.offsetLeft;
                    scrollLeft = stripEl.scrollLeft;
                    lastX = e.pageX;
                    lastTime = performance.now();
                    velocity = 0;
                });

                function handleRelease() {
                    if (!isMouseDown) return;
                    isMouseDown = false;
                    if (dragDistance > 6) {
                        isDraggingThumbStrip = true;
                        setTimeout(() => { isDraggingThumbStrip = false; }, 50);
                    }

                    if (Math.abs(velocity) > 0.1) {
                        let currentVelocity = velocity;
                        let lastFrameTime = performance.now();

                        function coastStep(now) {
                            const dt = Math.max(1, now - lastFrameTime);
                            lastFrameTime = now;

                            stripEl.scrollLeft -= currentVelocity * dt;
                            currentVelocity *= 0.93;

                            if (Math.abs(currentVelocity) < 0.05) {
                                stopInertia();
                                snapClosestThumbnailToCenter();
                            } else {
                                inertiaAnimationId = requestAnimationFrame(coastStep);
                            }
                        }

                        stopInertia();
                        inertiaAnimationId = requestAnimationFrame(coastStep);
                    } else {
                        snapClosestThumbnailToCenter();
                    }
                }

                stripEl.addEventListener('mouseleave', handleRelease);
                stripEl.addEventListener('mouseup', handleRelease);

                stripEl.addEventListener('mousemove', (e) => {
                    if (!isMouseDown) return;
                    e.preventDefault();
                    
                    const now = performance.now();
                    const dt = Math.max(1, now - lastTime);
                    const currentX = e.pageX;
                    const deltaX = currentX - lastX;

                    const instVelocity = (deltaX * 1.2) / dt;
                    velocity = velocity * 0.4 + instVelocity * 0.6;

                    lastX = currentX;
                    lastTime = now;

                    const x = currentX - stripEl.offsetLeft;
                    const walk = (x - startX) * 1.5;
                    dragDistance = Math.abs(x - startX);
                    stripEl.scrollLeft = scrollLeft - walk;
                });
            }

            function setupThumbStripScrollAndSnap() {
                const stripEl = document.getElementById('angle00-thumb-strip');
                if (!stripEl) return;

                let isTicking = false;

                stripEl.addEventListener('scroll', () => {
                    if (isProgrammaticScroll) return;

                    if (!isTicking) {
                        requestAnimationFrame(() => {
                            const containerWidth = stripEl.clientWidth;
                            const containerCenter = stripEl.scrollLeft + containerWidth / 2;
                            const thumbs = stripEl.querySelectorAll('.thumb-item');

                            let closestIdx = activeGlobalImageIndex;
                            let minDiff = Infinity;

                            thumbs.forEach((el) => {
                                const idx = parseInt(el.dataset.thumbIdx, 10);
                                const elCenter = el.offsetLeft + el.clientWidth / 2;
                                const diff = Math.abs(containerCenter - elCenter);
                                if (diff < minDiff) {
                                    minDiff = diff;
                                    closestIdx = idx;
                                }
                            });

                            if (closestIdx !== activeGlobalImageIndex) {
                                const prevSubCat = flatImageList[activeGlobalImageIndex] ? flatImageList[activeGlobalImageIndex].subCatName : '';
                                activeGlobalImageIndex = closestIdx;
                                const newSubCat = flatImageList[activeGlobalImageIndex] ? flatImageList[activeGlobalImageIndex].subCatName : '';

                                renderLightboxImage(prevSubCat !== newSubCat);
                                updateThumbOutlineOnly();
                            }

                            if (!inertiaAnimationId) {
                                clearTimeout(scrollSnapTimer);
                                scrollSnapTimer = setTimeout(() => {
                                    snapClosestThumbnailToCenter();
                                }, 150);
                            }

                            isTicking = false;
                        });
                        isTicking = true;
                    }
                }, { passive: true });
            }

            function setupTouchSwiping() {
                const lightboxEl = document.getElementById('angle00-lightbox-stage-container');
                if (!lightboxEl) return;

                lightboxEl.addEventListener('touchstart', (e) => {
                    touchStartX = e.changedTouches[0].screenX;
                }, { passive: true });

                lightboxEl.addEventListener('touchend', (e) => {
                    touchEndX = e.changedTouches[0].screenX;
                    const diff = touchEndX - touchStartX;
                    if (Math.abs(diff) > 40) {
                        if (diff < 0) window.angle00NavImage(1);
                        else window.angle00NavImage(-1);
                    }
                }, { passive: true });
            }

            window.initAngle00App();
        })();
    </script>
